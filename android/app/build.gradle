plugins {
    id 'com.android.application'
}

// URL ของแอปบน GitHub Pages — workflow ส่งค่าจริงมาให้ตอน build
def appUrl = (project.findProperty('appUrl') ?: 'https://hardza1230.github.io/CongratePrim/').toString()

android {
    namespace 'com.congrateprim.gobsong'
    compileSdk 35

    defaultConfig {
        applicationId "com.congrateprim.gobsong"
        minSdk 26
        targetSdk 35
        versionCode (project.findProperty('versionCode') ?: '1').toString().toInteger()
        versionName (project.findProperty('versionName') ?: '1.0').toString()
        buildConfigField "String", "APP_URL", "\"${appUrl}\""
    }

    signingConfigs {
        release {
            storeFile file('keystore.jks')
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: 'congrateprim'
            keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'gobsong'
            keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: 'congrateprim'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    // ธีมใช้ attribute ที่ใหม่กว่า minSdk (isLightTheme = API 29, windowLightNavigationBar = API 27,
    // monochrome icon = API 33) ซึ่งเครื่องรุ่นเก่าจะข้ามไปเองอย่างปลอดภัย จึงไม่ให้ lint ล้ม build
    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
