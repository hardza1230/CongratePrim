<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#10b981">
<meta name="description" content="แอปทำงบประมาณแบบซอง (Envelope Budgeting) สำหรับวางแผนการเงินครัวเรือน">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="งบซอง">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<title>งบซอง — Envelope Budgeting</title>
<style>
/* ---------- design tokens ---------- */
:root {
  --bg: #eef1f0;
  --surface: #ffffff;
  --surface-2: #f6f8f7;
  --surface-3: #eaefed;
  --text: #10201b;
  --text-2: #5b6b66;
  --text-3: #8a9994;
  --line: #e2e8e6;
  --brand: #10b981;
  --brand-strong: #0d9488;
  --brand-soft: #d9f5ea;
  --brand-ink: #065f46;
  --warn: #f59e0b;
  --warn-soft: #fef3c7;
  --danger: #ef4444;
  --danger-soft: #fee2e2;
  --info: #6366f1;
  --shadow: 0 1px 2px rgba(16, 32, 27, .06), 0 8px 24px rgba(16, 32, 27, .06);
  --shadow-lg: 0 -8px 40px rgba(16, 32, 27, .18);
  --r-sm: 12px;
  --r: 18px;
  --r-lg: 24px;
  --nav-h: 62px;
  --app-w: 480px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1210;
    --surface: #141d1a;
    --surface-2: #1b2521;
    --surface-3: #24302b;
    --text: #eaf2ef;
    --text-2: #a3b3ae;
    --text-3: #7b8b86;
    --line: #26332e;
    --brand: #34d399;
    --brand-strong: #2dd4bf;
    --brand-soft: #10352a;
    --brand-ink: #6ee7b7;
    --warn: #fbbf24;
    --warn-soft: #3a2e0d;
    --danger: #f87171;
    --danger-soft: #3d1a1a;
    --info: #818cf8;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
    --shadow-lg: 0 -8px 40px rgba(0, 0, 0, .55);
  }
}
:root[data-theme="dark"] {
  --bg: #0b1210;
  --surface: #141d1a;
  --surface-2: #1b2521;
  --surface-3: #24302b;
  --text: #eaf2ef;
  --text-2: #a3b3ae;
  --text-3: #7b8b86;
  --line: #26332e;
  --brand: #34d399;
  --brand-strong: #2dd4bf;
  --brand-soft: #10352a;
  --brand-ink: #6ee7b7;
  --warn: #fbbf24;
  --warn-soft: #3a2e0d;
  --danger: #f87171;
  --danger-soft: #3d1a1a;
  --info: #818cf8;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
  --shadow-lg: 0 -8px 40px rgba(0, 0, 0, .55);
}

/* ---------- base ---------- */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", "Sarabun", "Leelawadee UI", "Prompt", Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
h1, h2, h3, p { margin: 0; }
.num { font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

/* ---------- app shell ---------- */
.app {
  max-width: var(--app-w);
  margin: 0 auto;
  min-height: 100%;
  background: var(--bg);
  position: relative;
  box-shadow: 0 0 60px rgba(0, 0, 0, .07);
}
.appbar {
  position: sticky;
  top: 0;
  z-index: 30;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
}
.appbar-row { display: flex; align-items: center; gap: 10px; }
.brandmark {
  width: 34px; height: 34px; flex: none;
  border-radius: 11px;
  background: linear-gradient(135deg, var(--brand), var(--brand-strong));
  color: #fff; font-weight: 700; font-size: 17px;
  display: grid; place-items: center;
}
.appbar h1 { font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
.appbar .sub { font-size: 11.5px; color: var(--text-3); }
.icon-btn {
  width: 38px; height: 38px; flex: none;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  display: grid; place-items: center;
  font-size: 16px;
  transition: transform .15s, background .15s;
}
.icon-btn:active { transform: scale(.92); }

.monthbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-top: 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 4px;
}
.monthbar button {
  width: 40px; height: 34px; border-radius: 10px;
  color: var(--text-2); font-size: 16px;
  transition: background .15s;
}
.monthbar button:active { background: var(--surface-3); }
.monthbar .label { font-weight: 650; font-size: 14.5px; }
.monthbar .today {
  font-size: 11px; color: var(--brand-ink);
  background: var(--brand-soft); border-radius: 999px;
  padding: 1px 8px; margin-left: 6px;
}

main {
  padding: 16px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 26px);
}
.view { display: none; animation: fade .22s ease both; }
.view.active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- bottom nav ---------- */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
  max-width: var(--app-w); margin: 0 auto;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar button {
  height: var(--nav-h);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--text-3); font-size: 11px; font-weight: 500;
  transition: color .15s;
}
.tabbar button .ic { font-size: 19px; line-height: 1; transition: transform .2s; }
.tabbar button[aria-selected="true"] { color: var(--brand-ink); font-weight: 650; }
.tabbar button[aria-selected="true"] .ic { transform: translateY(-2px) scale(1.08); }

/* ---------- cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  padding: 16px;
}
.card + .card, .stack > * + * { margin-top: 12px; }
.section-title {
  display: flex; align-items: center; justify-content: space-between;
  margin: 22px 2px 10px;
  font-size: 13px; font-weight: 650; color: var(--text-2);
  letter-spacing: .01em;
}
.section-title:first-child { margin-top: 4px; }
.muted { color: var(--text-3); font-size: 12.5px; }

.hero {
  background: linear-gradient(140deg, var(--brand-strong), var(--brand));
  color: #fff; border: none;
  border-radius: var(--r-lg);
  padding: 20px;
  position: relative; overflow: hidden;
}
.hero::after {
  content: ""; position: absolute; right: -50px; top: -60px;
  width: 190px; height: 190px; border-radius: 50%;
  background: rgba(255, 255, 255, .12);
}
.hero .lbl { font-size: 12.5px; opacity: .9; }
.hero .big { font-size: 33px; font-weight: 700; margin-top: 2px; letter-spacing: -.02em; }
.hero-split { display: flex; gap: 10px; margin-top: 16px; position: relative; z-index: 1; }
.hero-split > div {
  flex: 1; background: rgba(255, 255, 255, .16);
  border-radius: 14px; padding: 9px 12px;
}
.hero-split .k { font-size: 11.5px; opacity: .92; }
.hero-split .v { font-size: 16px; font-weight: 650; }

/* ---------- ring ---------- */
.ring-wrap { display: flex; align-items: center; gap: 18px; }
.ring { width: 108px; height: 108px; flex: none; position: relative; }
.ring svg { transform: rotate(-90deg); display: block; }
.ring .center {
  position: absolute; inset: 0; display: grid; place-content: center; text-align: center;
}
.ring .pct { font-size: 20px; font-weight: 700; line-height: 1.1; }
.ring .cap { font-size: 10.5px; color: var(--text-3); }
.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.kv + .kv { margin-top: 9px; }
.kv .k { font-size: 13px; color: var(--text-2); }
.kv .v { font-weight: 650; }

/* ---------- bars ---------- */
.bar { height: 8px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: var(--brand); transition: width .45s cubic-bezier(.4, 0, .2, 1); }
.is-warn .bar > i { background: var(--warn); }
.is-over .bar > i { background: var(--danger); }

.catrow + .catrow { margin-top: 14px; }
.catrow .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; gap: 8px; }
.catrow .nm { font-size: 13.5px; font-weight: 600; }
.catrow .am { font-size: 12.5px; color: var(--text-2); }

/* ---------- envelope card ---------- */
.env {
  width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); box-shadow: var(--shadow);
  padding: 13px 14px; display: block;
  transition: transform .15s, border-color .15s;
}
.env:active { transform: scale(.985); }
.env + .env { margin-top: 10px; }
.env.is-over { border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); }
.env .head { display: flex; align-items: center; gap: 11px; }
.emoji {
  width: 40px; height: 40px; flex: none; border-radius: 13px;
  background: var(--surface-2); border: 1px solid var(--line);
  display: grid; place-items: center; font-size: 19px;
}
/* ตราธนาคาร: วงกลมสีแบรนด์ + ตัวย่อ */
.badge {
  width: 40px; height: 40px; flex: none; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 800; letter-spacing: -.02em;
  line-height: 1; text-align: center; padding: 2px;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08);
}
.badge.sm { font-size: 10px; }
.badge.xs { font-size: 8.5px; }
.env .nm { font-weight: 600; font-size: 14.5px; line-height: 1.25; overflow-wrap: anywhere; }
.env .sub { font-size: 11.5px; color: var(--text-3); }
.env .right { margin-left: auto; text-align: right; flex: none; }
.env .left-am { font-weight: 700; font-size: 15px; }
.env .of { font-size: 11px; color: var(--text-3); }
.env .bar { margin-top: 11px; }
.is-over .left-am { color: var(--danger); }

.chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10.5px; font-weight: 600;
  padding: 2px 8px; border-radius: 999px;
  background: var(--surface-3); color: var(--text-2);
}
.chip.ok { background: var(--brand-soft); color: var(--brand-ink); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.over { background: var(--danger-soft); color: var(--danger); }

/* ---------- list rows ---------- */
.row {
  display: flex; align-items: center; gap: 11px;
  padding: 11px 0;
}
.row + .row { border-top: 1px solid var(--line); }
.row .nm { font-weight: 550; font-size: 14px; overflow-wrap: anywhere; }
.row .sub { font-size: 11.5px; color: var(--text-3); }
.row .amt { margin-left: auto; font-weight: 650; text-align: right; flex: none; }

.owner-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; margin-bottom: 4px;
}
.owner-head .nm { font-weight: 650; font-size: 14.5px; display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

/* ---------- bills table ---------- */
.table-wrap {
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  border: 1px solid var(--line); border-radius: var(--r);
  background: var(--surface); box-shadow: var(--shadow);
}
table.bills { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
table.bills th, table.bills td { padding: 0; }
table.bills thead th {
  position: sticky; top: 0; z-index: 2;
  background: var(--surface-2);
  font-size: 11px; font-weight: 650; color: var(--text-2);
  padding: 9px 0; width: 46px; text-align: center;
  border-bottom: 1px solid var(--line);
}
table.bills th.rowhead, table.bills td.rowhead {
  position: sticky; left: 0; z-index: 3;
  background: var(--surface); width: 148px; min-width: 148px; max-width: 148px;
  text-align: left; padding: 8px 10px;
  border-right: 1px solid var(--line);
}
table.bills thead th.rowhead { z-index: 4; background: var(--surface-2); }
table.bills td.rowhead .nm { font-size: 12.5px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
table.bills td.rowhead .am { font-size: 11px; color: var(--text-3); }
table.bills tbody tr + tr td { border-top: 1px solid var(--line); }
table.bills th.now, table.bills td.now { background: var(--brand-soft); }
table.bills td.now.rowhead { background: var(--brand-soft); }
.tick {
  width: 100%; height: 42px; display: grid; place-items: center;
  font-size: 15px; color: var(--text-3);
  transition: transform .12s;
}
.tick:active { transform: scale(.85); }
.tick.on { color: var(--brand); }
tfoot td { border-top: 1px solid var(--line) !important; background: var(--surface-2); }
tfoot .sum { font-size: 10.5px; text-align: center; padding: 8px 2px; color: var(--text-2); font-weight: 600; }
tfoot td.rowhead { background: var(--surface-2); font-size: 12px; font-weight: 650; }

/* ---------- forms ---------- */
label.field { display: block; margin-top: 14px; }
label.field > span { display: block; font-size: 12.5px; color: var(--text-2); margin-bottom: 6px; font-weight: 550; }
input[type="text"], input[type="number"], select, textarea {
  width: 100%; padding: 12px 14px;
  background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 14px;
  outline: none; transition: border-color .15s, background .15s;
  appearance: none; -webkit-appearance: none;
}
select {
  background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%), linear-gradient(135deg, var(--text-3) 50%, transparent 50%);
  background-position: calc(100% - 19px) 21px, calc(100% - 14px) 21px;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 38px;
}
input:focus, select:focus, textarea:focus { border-color: var(--brand); background: var(--surface); }
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; }
input.amount { font-size: 26px; font-weight: 700; text-align: center; padding: 14px; }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  width: 100%; padding: 14px; border-radius: 15px;
  font-weight: 650; font-size: 15px;
  background: var(--brand); color: #04231a;
  transition: transform .12s, opacity .15s;
}
:root[data-theme="dark"] .btn, :root:not([data-theme="light"]) .btn { color: #04231a; }
.btn:active { transform: scale(.98); }
.btn.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.sm { padding: 11px; font-size: 14px; border-radius: 13px; }
.btn-row { display: flex; gap: 10px; margin-top: 14px; }
.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }

/* ---------- bottom sheet ---------- */
.scrim {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(6, 16, 13, .5);
  backdrop-filter: blur(2px);
  opacity: 0; pointer-events: none; transition: opacity .25s;
}
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; z-index: 51; left: 0; right: 0; bottom: 0;
  max-width: var(--app-w); margin: 0 auto;
  background: var(--surface);
  border-radius: 26px 26px 0 0;
  box-shadow: var(--shadow-lg);
  padding: 8px 18px calc(env(safe-area-inset-bottom) + 22px);
  max-height: 88vh; overflow-y: auto;
  transform: translateY(102%);
  transition: transform .3s cubic-bezier(.32, .72, 0, 1);
}
.sheet.open { transform: none; }
.grabber { width: 40px; height: 4px; border-radius: 999px; background: var(--line); margin: 6px auto 12px; }
.sheet h2 { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.sheet .sheet-sub { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }
.sheet-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 4px; }

.seg { display: flex; gap: 6px; background: var(--surface-2); border-radius: 14px; padding: 4px; margin-top: 14px; }
.seg button {
  flex: 1; padding: 9px 4px; border-radius: 11px;
  font-size: 13px; font-weight: 600; color: var(--text-2);
  transition: background .18s, color .18s;
}
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

/* ---------- นับเงิน ---------- */
.count-cta {
  width: 100%; display: flex; align-items: center; gap: 13px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); box-shadow: var(--shadow);
  padding: 14px; margin-bottom: 12px; text-align: left;
  transition: transform .15s;
}
.count-cta:active { transform: scale(.985); }
.count-cta .ic {
  width: 44px; height: 44px; flex: none; border-radius: 14px;
  background: linear-gradient(140deg, var(--brand), var(--brand-strong));
  display: grid; place-items: center; font-size: 21px;
}
.count-cta .t { display: block; font-weight: 700; font-size: 15.5px; }
.count-cta .s { display: block; font-size: 12px; color: var(--text-3); overflow-wrap: anywhere; }
.count-cta .go { margin-left: auto; color: var(--text-3); font-size: 20px; flex: none; }

.steps { display: flex; gap: 6px; margin: 4px 0 14px; }
.steps i {
  flex: 1; height: 4px; border-radius: 999px; background: var(--surface-3);
  transition: background .25s;
}
.steps i.on { background: var(--brand); }

.tally {
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: 11px 13px; margin-bottom: 12px;
}
.tally .kv .v { font-size: 15px; }

.cnt-row { display: flex; align-items: center; gap: 11px; padding: 9px 0; }
.cnt-row + .cnt-row { border-top: 1px solid var(--line); }
.cnt-row .nm { font-weight: 600; font-size: 13.5px; overflow-wrap: anywhere; }
.cnt-row .was { font-size: 11px; color: var(--text-3); }
.cnt-row input {
  width: 116px; flex: none; margin-left: auto;
  padding: 9px 11px; text-align: right; font-weight: 650;
  font-variant-numeric: tabular-nums; border-radius: 12px;
}
.cnt-row .delta { font-size: 11px; margin-top: 2px; text-align: right; }
.delta.down { color: var(--danger); }
.delta.up { color: var(--brand-ink); }

.pick {
  width: 100%; display: flex; align-items: center; gap: 11px;
  padding: 10px 0; text-align: left;
}
.pick + .pick { border-top: 1px solid var(--line); }
.pick .box {
  width: 24px; height: 24px; flex: none; border-radius: 8px;
  border: 2px solid var(--line); display: grid; place-items: center;
  font-size: 14px; color: transparent; transition: background .15s, border-color .15s, color .15s;
}
.pick.on .box { background: var(--brand); border-color: var(--brand); color: #04231a; }
.pick.done { opacity: .5; }
.pick .nm { display: block; font-weight: 550; font-size: 14px; overflow-wrap: anywhere; }
.pick .sub { display: block; font-size: 11px; color: var(--text-3); }
.pick .amt {
  margin-left: auto; flex: none; width: 96px; text-align: right;
  font-weight: 650; font-variant-numeric: tabular-nums;
  padding: 8px 10px; border-radius: 10px; background: var(--surface-2);
  border: 1px dashed var(--line); font-size: 13.5px;
}
.pick.on .amt { border-style: solid; border-color: var(--brand); }
.pick .amt:disabled { color: var(--text-3); }

.row.tap { cursor: pointer; border-radius: 12px; transition: background .15s; }
.row.tap:active { background: var(--surface-2); }
.nudges { display: flex; flex-direction: column; gap: 2px; flex: none; }
.nudges .nudge { width: 26px; height: 22px; font-size: 10px; border-radius: 7px; }
.nudges .nudge:disabled { visibility: hidden; }

/* สวิตช์ */
.switch { display: flex; align-items: center; gap: 11px; padding: 11px 0; }
.switch + .switch { border-top: 1px solid var(--line); }
.switch .lbl { font-size: 13.5px; font-weight: 550; }
.switch .lbl small { display: block; font-weight: 400; font-size: 11.5px; color: var(--text-3); }
.switch .tgl {

const TH_MONTHS_FULL = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];

function pad(n) { return n < 10 ? '0' + n : '' + n; }
function monthKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function uid(prefix) { return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

const nf = new Intl.NumberFormat('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
function money(n) {
  const v = Math.round((Number(n) || 0) * 100) / 100;
  return (v < 0 ? '-฿' : '฿') + nf.format(Math.abs(v));
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {

  const parts = key.split('-');

  s.counts = s.counts || [];
  s.owners = s.owners || [];
  s.categories = s.categories || [];
  s.accounts = s.accounts || [];
  s.activeMonth = s.activeMonth || monthKey(new Date());

  s.accounts.forEach(function (a) {
    if (a.kind === undefined) a.kind = guessKind(a);
    if (a.bankId === undefined) a.bankId = guessBank(a.name);
    if (a.countable === undefined) a.countable = a.kind !== 'receivable';
    if (a.hidden === undefined) a.hidden = false;
    if (a.color === undefined) a.color = '';
    if (a.note === undefined) a.note = '';
    a.balance = Number(a.balance) || 0;
  });

  // ต้องมีซองปลายทางของส่วนต่างเสมอ
  if (!s.miscEnvelopeId || !s.envelopes.some(function (e) { return e.id === s.miscEnvelopeId; })) {
    let misc = s.envelopes.find(function (e) { return e.id === 'e18'; });
    if (!misc) {
      misc = {
        id: uid('e'), categoryId: (s.categories[0] || {}).id, ownerId: (s.owners[0] || {}).id,
        emoji: '🧾', name: 'จิปาถะ (ไม่ได้ระบุ)', budget: 0, dueDay: 0, recurring: false
      };
      s.envelopes.push(misc);
    }
    s.miscEnvelopeId = misc.id;
  }

  s.schema = 2;
  return s;
}

function guessKind(a) {
  const e = a.emoji || '';
  if (e.indexOf('🛡') === 0) return 'savings';
  if (e.indexOf('💵') === 0) return 'cash';
  if (e.indexOf('🧾') === 0) return 'receivable';
  if (e.indexOf('📱') === 0 || e.indexOf('🛍') === 0) return 'ewallet';
  if (e.indexOf('🏦') === 0) return 'bank';
  return 'other';
}

function guessBank(name) {
  const n = (name || '').toUpperCase();
  const rules = [
    ['scb', ['SCB', 'ไทยพาณิชย์']], ['kbank', ['KBANK', 'กสิกร']], ['ktb', ['KTB', 'กรุงไทย']],
    ['ttb', ['TTB', 'ทหารไทย', 'ธนชาต']], ['gsb', ['GSB', 'ออมสิน']], ['kkp', ['KKP', 'เกียรตินาคิน']],
    ['bbl', ['BBL', 'กรุงเทพ']], ['bay', ['BAY', 'กรุงศรี']], ['baac', ['BAAC', 'ธ.ก.ส']],
    ['ghb', ['ธอส', 'อาคารสงเคราะห์']], ['uob', ['UOB']], ['cimb', ['CIMB']], ['tisco', ['TISCO']],
    ['truemoney', ['TRUE']], ['shopeepay', ['SHOPEE']], ['linepay', ['LINE PAY', 'RABBIT']]
  ];
  for (let i = 0; i < rules.length; i++) {
    const hit = rules[i][1].some(function (kw) { return n.indexOf(kw.toUpperCase()) >= 0; });
    if (hit) return rules[i][0];
  }
  return '';
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch (e) { toast('บันทึกข้อมูลไม่สำเร็จ (พื้นที่เต็ม)'); }
}

const byId = function (list, id) { return list.find(function (x) { return x.id === id; }) || null; };
const owner = function (id) { return byId(state.owners, id); };
const account = function (id) { return byId(state.accounts, id); };
const category = function (id) { return byId(state.categories, id); };
const envelope = function (id) { return byId(state.envelopes, id); };
const bank = function (id) { return BANKS.find(function (b) { return b.id === id; }) || null; };
const kindOf = function (id) { return KINDS.find(function (k) { return k.id === id; }) || KINDS[KINDS.length - 1]; };

// บัญชีที่จะไล่ถามตอนนับเงิน (ตามลำดับที่จัดไว้ในหน้าบัญชี)
function countableAccounts() {
  return state.accounts.filter(function (a) { return a.countable !== false && !a.hidden; });
}
function visibleAccounts(ownerId) {
  return state.accounts.filter(function (a) { return a.ownerId === ownerId; });
}

/* ================= การคำนวณ (รวมศูนย์ที่เดียว) ================= */
function budgetOf(envId, month) {
  const env = envelope(envId);
  if (!env) return 0;
  let b = Number(env.budget) || 0;
  state.transfers.forEach(function (t) {
    if (t.month !== month) return;
    if (t.toEnvelopeId === envId) b += t.amount;
    if (t.fromEnvelopeId === envId) b -= t.amount;
  });
  return b;
}
function spentOf(envId, month) {
  return state.txns.reduce(function (sum, t) {
    return t.envelopeId === envId && t.month === month ? sum + t.amount : sum;
  }, 0);
}
function leftOf(envId, month) { return budgetOf(envId, month) - spentOf(envId, month); }
function statusOf(budget, spent) {
  if (spent > budget) return 'over';
  if (budget > 0 && spent / budget >= 0.8) return 'warn';
  return 'ok';
}
function totals(month) {
  let budget = 0, spent = 0;
  state.envelopes.forEach(function (e) { budget += budgetOf(e.id, month); spent += spentOf(e.id, month); });
  return { budget: budget, spent: spent, left: budget - spent };
}
function totalAssets() { return state.accounts.reduce(function (s, a) { return s + (Number(a.balance) || 0); }, 0); }
function totalDebts() { return state.debts.reduce(function (s, d) { return s + (Number(d.remaining) || 0); }, 0); }
function assetsOfOwner(ownerId) {
  return state.accounts.reduce(function (s, a) { return a.ownerId === ownerId ? s + (Number(a.balance) || 0) : s; }, 0);
}
function billsOf(envId) { return state.bills[envId] || (state.bills[envId] = {}); }

/* ========================= actions ========================= */

/* บันทึกรายจ่ายลงซอง — ไม่แตะยอดบัญชี
   ตอนนับเงินเราตั้งยอดบัญชีตรง ๆ อยู่แล้ว ถ้าหักตรงนี้ด้วยจะกลายเป็นหักซ้ำสองรอบ */
function addTxn(envId, amount, opts) {
  opts = opts || {};
  state.txns.push({
    id: uid('t'), envelopeId: envId, accountId: opts.accountId || '',
    amount: amount, note: opts.note || '', date: opts.date || todayISO(),
    month: opts.month || state.activeMonth, countId: opts.countId || ''
  });
  return autoTickBill(envId, opts.month || state.activeMonth);
}

// จ่ายครบงบของบิลรายเดือน → ติ๊กตารางบิลให้อัตโนมัติ
function autoTickBill(envId, month) {
  const env = envelope(envId);
  if (!env || !env.recurring) return false;
  const budget = budgetOf(envId, month);
  if (budget > 0 && spentOf(envId, month) >= budget && !billsOf(envId)[month]) {
    billsOf(envId)[month] = true;
    return true;
  }
  return false;
}

// บันทึกจ่ายทีละรายการ (แท็บซอง) — หักยอดบัญชีที่เลือกด้วย
function recordSpend(envId, accountId, amount, note) {
  const ticked = addTxn(envId, amount, { accountId: accountId, note: note });
  const acc = account(accountId);
  if (acc) acc.balance = (Number(acc.balance) || 0) - amount;
  save();
  return ticked;
}
function removeTxn(txnId) {
  const i = state.txns.findIndex(function (t) { return t.id === txnId; });
  if (i < 0) return;
  const t = state.txns[i];
  const acc = account(t.accountId);
  if (acc) acc.balance = (Number(acc.balance) || 0) + t.amount;
  state.txns.splice(i, 1);
  save();
}
function moveMoney(fromId, toId, amount) {
  state.transfers.push({
    id: uid('m'), fromEnvelopeId: fromId, toEnvelopeId: toId,
    amount: amount, month: state.activeMonth, date: todayISO()
  });
  save();
}

/* ---------------- การนับเงิน ---------------- */

// บันทึกการนับหนึ่งรอบ: ตั้งยอดบัญชีใหม่ แล้วลงรายจ่ายของซองที่ติ๊ก + ส่วนต่างลงซองจิปาถะ
function saveCount(draft) {
  const month = state.activeMonth;
  const countId = uid('c');
  const before = {}, after = {};
  let drop = 0;

  countableAccounts().forEach(function (a) {
    const nv = draft.balances[a.id];
    const oldV = Number(a.balance) || 0;
    const newV = (nv === undefined || nv === null || nv === '') ? oldV : Number(nv);
    before[a.id] = oldV;
    after[a.id] = newV;
    drop += oldV - newV;
  });

  let ticked = 0;
  Object.keys(draft.paid).forEach(function (envId) {
    const amt = Number(draft.paid[envId]) || 0;
    if (amt > 0) ticked += amt;
  });

  const misc = Math.round((drop - ticked) * 100) / 100;
  const miscEnvId = draft.miscEnvelopeId || state.miscEnvelopeId;
  const miscAmount = draft.miscOverride !== undefined && draft.miscOverride !== null
    ? Number(draft.miscOverride) || 0
    : Math.max(0, misc);

  // ตั้งยอดบัญชีใหม่ก่อน แล้วค่อยลง txn ผ่าน addTxn ที่ไม่หักบัญชีซ้ำ
  Object.keys(after).forEach(function (accId) {
    const acc = account(accId);
    if (acc) acc.balance = after[accId];
  });

  Object.keys(draft.paid).forEach(function (envId) {
    const amt = Number(draft.paid[envId]) || 0;
    if (amt > 0) addTxn(envId, amt, { countId: countId, month: month, note: 'จากการนับเงิน' });
  });
  if (miscAmount > 0 && miscEnvId) {
    addTxn(miscEnvId, miscAmount, { countId: countId, month: month, note: 'ส่วนต่างจากการนับเงิน' });
  }

  state.counts.push({
    id: countId, date: todayISO(), month: month,
    before: before, after: after,
    drop: drop, ticked: ticked, misc: miscAmount,
    income: drop < 0 ? -drop : 0,
    // เก็บภาพรวมไว้ด้วย เพื่อวาดกราฟย้อนหลังได้โดยไม่ต้องเดาย้อนจาก before/after
    // (after มีเฉพาะบัญชีที่ตั้งให้นับ จึงประกอบกลับเป็นสินทรัพย์รวมไม่ได้)
    assets: totalAssets(), debts: totalDebts(), netWorth: totalAssets() - totalDebts(),
    note: draft.note || ''
  });
  save();
  return { drop: drop, ticked: ticked, misc: miscAmount, income: drop < 0 ? -drop : 0 };
}

// ยกเลิกการนับ: คืนยอดบัญชีจาก before แล้วลบ txn ที่เกิดจากการนับรอบนั้น
function undoCount(countId) {
  const i = state.counts.findIndex(function (c) { return c.id === countId; });
  if (i < 0) return false;
  const c = state.counts[i];
  Object.keys(c.before).forEach(function (accId) {
    const acc = account(accId);
    if (acc) acc.balance = c.before[accId];
  });
  const removed = state.txns.filter(function (t) { return t.countId === countId; });
  state.txns = state.txns.filter(function (t) { return t.countId !== countId; });
  // บิลที่ถูกติ๊กอัตโนมัติจากรอบนี้ ถ้าตอนนี้จ่ายไม่ครบงบแล้วก็ปลดติ๊กออก
  removed.forEach(function (t) {
    const env = envelope(t.envelopeId);
    if (env && env.recurring && billsOf(t.envelopeId)[t.month] &&
        spentOf(t.envelopeId, t.month) < budgetOf(t.envelopeId, t.month)) {
      delete billsOf(t.envelopeId)[t.month];
    }
  });
  state.counts.splice(i, 1);
  save();
  return true;
}

function lastCount() { return state.counts.length ? state.counts[state.counts.length - 1] : null; }

function daysSince(iso) {
  const then = new Date(iso + 'T00:00:00');
  const now = new Date(todayISO() + 'T00:00:00');
  return Math.round((now - then) / 86400000);
}

/* ========================= UI bits ========================= */
function ring(pct, label) {
  const r = 46, c = 2 * Math.PI * r;
  const clamped = Math.max(0, Math.min(1, pct));
  const color = pct > 1 ? 'var(--danger)' : (pct >= 0.8 ? 'var(--warn)' : 'var(--brand)');
  return '<div class="ring">' +
    '<svg width="108" height="108" viewBox="0 0 108 108" aria-hidden="true">' +
      '<circle cx="54" cy="54" r="' + r + '" fill="none" stroke="var(--surface-3)" stroke-width="11"/>' +
      '<circle cx="54" cy="54" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="11" stroke-linecap="round" ' +
        'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + (c * (1 - clamped)).toFixed(1) + '"/>' +
    '</svg>' +
    '<div class="center"><div class="pct num">' + Math.round(pct * 100) + '%</div><div class="cap">' + label + '</div></div>' +
  '</div>';
}
function barHTML(spent, budget) {
  const pct = budget > 0 ? Math.min(1, spent / budget) : (spent > 0 ? 1 : 0);
  return '<div class="bar"><i style="width:' + (pct * 100).toFixed(1) + '%"></i></div>';
}

// ตราประจำบัญชี: ธนาคาร/วอลเล็ตใช้วงกลมสีแบรนด์ + ตัวย่อ, ที่เหลือใช้อีโมจิตามประเภท
function accountBadge(a) {
  const b = bank(a.bankId);
  const color = a.color || (b ? b.color : '');
  if (color) {
    const label = b ? b.abbr : (a.name || '?').trim().slice(0, 4);
    const ink = (!a.color && b && b.ink) ? b.ink : '#ffffff';
    const size = label.length > 4 ? ' xs' : (label.length > 3 ? ' sm' : '');
    return '<span class="badge' + size + '" style="background:' + esc(color) + ';color:' + ink + '">' + esc(label) + '</span>';
  }
  return '<span class="emoji">' + esc(a.emoji || kindOf(a.kind).emoji) + '</span>';
}

/* ========================= กราฟ (SVG เขียนเอง ไม่พึ่งไลบรารี) =========================
   ทุกกราฟมีป้ายค่ากำกับให้อ่านได้โดยไม่ต้องพึ่งสี และมีมุมมองตารางสลับได้
   ตามข้อกำหนดการเข้าถึง — สีเป็นช่องทางเสริม ไม่ใช่ช่องทางเดียว */

function shortMoney(n) {
  const v = Math.abs(n);
  if (v >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'ล.';
  if (v >= 1000) return Math.round(n / 1000) + 'พ.';
  return String(Math.round(n));
}

// กราฟเส้น — ใช้กับข้อมูลชุดเดียวที่เดินตามเวลา จึงไม่ต้องมีคำอธิบายสี
function lineChart(points, opts) {
  opts = opts || {};
  const W = 320, H = 150, L = 8, R = 8, T = 16, B = 22;
  const pw = W - L - R, ph = H - T - B;
  const vals = points.map(function (p) { return p.v; });
  let min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if (min === max) { min -= 1; max += 1; }
  const pad = (max - min) * 0.15;
  min -= pad; max += pad;
  const x = function (i) { return L + (points.length === 1 ? pw / 2 : pw * i / (points.length - 1)); };
  const y = function (v) { return T + ph - ph * (v - min) / (max - min); };

  let g = '';
  for (let i = 0; i <= 2; i++) {
    const yy = T + ph * i / 2;
    g += '<line class="gridline" x1="' + L + '" y1="' + yy.toFixed(1) + '" x2="' + (W - R) + '" y2="' + yy.toFixed(1) + '"/>';
  }
  const d = points.map(function (p, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1); }).join(' ');
  const area = d + ' L' + x(points.length - 1).toFixed(1) + ' ' + (T + ph) + ' L' + x(0).toFixed(1) + ' ' + (T + ph) + ' Z';

  let marks = '<path d="' + area + '" fill="var(--s1)" opacity=".10"/>' +
    '<path d="' + d + '" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
  points.forEach(function (p, i) {
    marks += '<circle class="dot" cx="' + x(i).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="4" fill="var(--s1)"/>';
    marks += '<circle class="hit" cx="' + x(i).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="16" ' +
      'data-tip="' + esc(p.label + ' · ' + money(p.v)) + '"/>';
  });
  // ป้ายค่าเฉพาะจุดล่าสุด ไม่ใส่ทุกจุดเพราะจะรกและไม่มีใครอ่าน
  const lastI = points.length - 1;
  const lx = Math.min(W - R - 2, Math.max(L + 2, x(lastI)));
  marks += '<text class="vlabel" x="' + lx.toFixed(1) + '" y="' + Math.max(10, y(points[lastI].v) - 9).toFixed(1) + '" ' +
    'text-anchor="' + (lastI === 0 ? 'middle' : 'end') + '">' + esc(money(points[lastI].v)) + '</text>';

  let ticks = '';
  points.forEach(function (p, i) {
    if (points.length > 6 && i % 2) return;
    ticks += '<text class="tick" x="' + x(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(p.tick) + '</text>';
  });

  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opts.aria || '') + '">' +
    g + marks +
    '<line class="axisline" x1="' + L + '" y1="' + (T + ph) + '" x2="' + (W - R) + '" y2="' + (T + ph) + '"/>' +
    ticks + '</svg>';
}

// กราฟแท่ง — ชุดเดียว ใช้สีเดียวทุกแท่ง (ห้ามไล่เฉดตามค่า) + เส้นอ้างอิงงบ
function columnChart(bars, opts) {
  opts = opts || {};
  const W = 320, H = 158, L = 6, R = 6, T = 18, B = 22;
  const pw = W - L - R, ph = H - T - B;
  const maxV = Math.max.apply(null, bars.map(function (b) { return b.v; }).concat(opts.ref ? [opts.ref] : [0]));
  const top = maxV > 0 ? maxV * 1.18 : 1;
  const slot = pw / bars.length;
  const bw = Math.min(34, slot * 0.62);      // แท่งบาง เว้นช่องว่างระหว่างแท่ง
  const y = function (v) { return T + ph - ph * v / top; };

  let g = '';
  for (let i = 0; i <= 2; i++) {
    const yy = T + ph * i / 2;
    g += '<line class="gridline" x1="' + L + '" y1="' + yy.toFixed(1) + '" x2="' + (W - R) + '" y2="' + yy.toFixed(1) + '"/>';
  }

  let marks = '', ticks = '';
  bars.forEach(function (b, i) {
    const cx = L + slot * i + slot / 2;
    const bx = cx - bw / 2;
    const by = y(b.v), bh = Math.max(b.v > 0 ? 2 : 0, T + ph - by);
    if (b.v > 0) {
      marks += '<rect x="' + bx.toFixed(1) + '" y="' + by.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" ' +
        'rx="4" fill="var(--s1)"/>';
      marks += '<text class="vlabel" x="' + cx.toFixed(1) + '" y="' + Math.max(9, by - 5).toFixed(1) + '" text-anchor="middle">' +
        esc(shortMoney(b.v)) + '</text>';
    }
    marks += '<rect class="hit" x="' + (cx - slot / 2).toFixed(1) + '" y="' + T + '" width="' + slot.toFixed(1) + '" height="' + ph + '" ' +
      'data-tip="' + esc(b.label + ' · ' + money(b.v)) + '"/>';
    ticks += '<text class="tick" x="' + cx.toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(b.tick) + '</text>';
  });

  let ref = '';
  if (opts.ref > 0) {
    const ry = y(opts.ref);
    ref = '<line class="refline" x1="' + L + '" y1="' + ry.toFixed(1) + '" x2="' + (W - R) + '" y2="' + ry.toFixed(1) + '"/>' +
      '<text class="reflabel" x="' + (W - R) + '" y="' + Math.max(8, ry - 4).toFixed(1) + '" text-anchor="end">' +
      esc(opts.refLabel || '') + '</text>';
  }

  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opts.aria || '') + '">' +
    g + ref + marks +
    '<line class="axisline" x1="' + L + '" y1="' + (T + ph) + '" x2="' + (W - R) + '" y2="' + (T + ph) + '"/>' +
    ticks + '</svg>';
}

// แถบสัดส่วนแนวนอน — ส่วนต่อภาพรวม เว้นช่องว่าง 2px ระหว่างชิ้นแทนการตีเส้นขอบ
function stackedBar(parts, total) {
  if (!total) return '';
  const W = 320, H = 26, gap = 2;
  let x = 0, out = '';
  parts.forEach(function (p, i) {
    const w = Math.max(0, (W - gap * (parts.length - 1)) * p.v / total);
    if (w > 0) {
      out += '<rect x="' + x.toFixed(1) + '" y="0" width="' + w.toFixed(1) + '" height="' + H + '" rx="4" fill="' + p.color + '"/>';
      out += '<rect class="hit" x="' + x.toFixed(1) + '" y="0" width="' + w.toFixed(1) + '" height="' + H + '" ' +
        'data-tip="' + esc(p.label + ' · ' + money(p.v) + ' (' + Math.round(p.v / total * 100) + '%)') + '"/>';
    }
    x += w + gap;
  });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="สัดส่วนรายจ่ายตามหมวด">' + out + '</svg>';
}

function statTile(k, v, d) {
  return '<div class="tile"><div class="k">' + esc(k) + '</div><div class="v num">' + esc(v) + '</div>' +
    (d ? '<div class="d">' + esc(d) + '</div>' : '') + '</div>';
}

function dataTable(head, rows) {
  return '<table class="dtable"><thead><tr>' +
    head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') +
    '</tr></thead><tbody>' +
    rows.map(function (r) {
      return '<tr>' + r.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>';
    }).join('') +
    '</tbody></table>';
}

/* ========================= views ========================= */
function renderOverview() {
  const m = state.activeMonth;
  const t = totals(m);
  const assets = totalAssets(), debts = totalDebts();
  const pct = t.budget > 0 ? t.spent / t.budget : 0;

  const last = lastCount();
  const since = last ? daysSince(last.date) : null;
  let html = '<button class="count-cta" data-action="start-count">' +
    '<span class="ic">🧮</span>' +
    '<span style="min-width:0"><span class="t">นับเงิน</span>' +
    '<span class="s">' + (last
      ? 'นับล่าสุด ' + (since === 0 ? 'วันนี้' : since === 1 ? 'เมื่อวาน' : since + ' วันก่อน') +
        ' · ' + (last.drop < 0 ? 'เงินเข้า ' : 'ใช้ไป ') + money(Math.abs(last.drop))
      : 'ยังไม่เคยนับ — เริ่มรอบแรกได้เลย') + '</span></span>' +
    '<span class="go">›</span>' +
  '</button>';

  html += '<div class="card hero">' +
    '<div class="lbl">💎 สินทรัพย์สุทธิ (Net Worth)</div>' +
    '<div class="big num">' + money(assets - debts) + '</div>' +
    '<div class="hero-split">' +
      '<div><div class="k">💰 สินทรัพย์รวม</div><div class="v num">' + money(assets) + '</div></div>' +
      '<div><div class="k">💳 หนี้สินรวม</div><div class="v num">' + money(debts) + '</div></div>' +
    '</div>' +
  '</div>';

  html += '<div class="section-title"><span>งบประมาณเดือน ' + esc(monthLabel(m, true)) + '</span></div>';
  html += '<div class="card"><div class="ring-wrap">' + ring(pct, 'ใช้ไปแล้ว') +
    '<div style="flex:1;min-width:0">' +
      '<div class="kv"><span class="k">งบทั้งหมด</span><span class="v num">' + money(t.budget) + '</span></div>' +
      '<div class="kv"><span class="k">จ่ายจริง</span><span class="v num">' + money(t.spent) + '</span></div>' +
      '<div class="kv"><span class="k">คงเหลือ</span><span class="v num" style="color:' + (t.left < 0 ? 'var(--danger)' : 'var(--brand-ink)') + '">' + money(t.left) + '</span></div>' +
    '</div>' +
  '</div></div>';

  html += '<div class="section-title"><span>แยกตามหมวดหมู่</span></div><div class="card">';
  state.categories.forEach(function (c) {
    let b = 0, s = 0;
    state.envelopes.forEach(function (e) {
      if (e.categoryId !== c.id) return;
      b += budgetOf(e.id, m); s += spentOf(e.id, m);
    });
    const st = statusOf(b, s);
    html += '<div class="catrow is-' + st + '">' +
      '<div class="top"><span class="nm">' + esc(c.name) + '</span>' +
      '<span class="am num">' + money(s) + ' / ' + money(b) + '</span></div>' +
      barHTML(s, b) + '</div>';
  });
  html += '</div>';

  const watch = state.envelopes
    .map(function (e) {
      const b = budgetOf(e.id, m), s = spentOf(e.id, m);
      return { env: e, b: b, s: s, st: statusOf(b, s) };
    })
    .filter(function (x) { return x.st !== 'ok' && (x.b > 0 || x.s > 0); })
    .sort(function (a, z) { return (z.s - z.b) - (a.s - a.b); });

  if (watch.length) {
    html += '<div class="section-title"><span>⚠️ ซองที่ต้องระวัง</span></div><div class="card">';
    watch.forEach(function (x, i) {
      html += '<div class="row"' + (i === 0 ? ' style="padding-top:0"' : '') + '>' +

        '<div style="min-width:0"><div class="nm">' + esc(x.env.name) + '</div>' +
        '<div class="sub">' + (x.st === 'over' ? 'เกินงบ ' + money(x.s - x.b) : 'ใช้ไป ' + Math.round(x.s / x.b * 100) + '% ของงบ') + '</div></div>' +

      '<div class="amt num">' + money(v) + '</div></div>';
  });

  if (state.counts.length) {
    const recent = state.counts.slice(-5).reverse();
    html += '<div class="section-title"><span>ประวัติการนับเงิน</span>' +

    recent.forEach(function (c, i) {
      html += '<button class="row" style="width:100%;text-align:left' + (i === 0 ? ';padding-top:0' : '') + '" ' +

        '<div style="min-width:0"><div class="nm">' + esc(c.date) + '</div>' +
        '<div class="sub">ติ๊ก ' + money(c.ticked) + ' · จิปาถะ ' + money(c.misc) + '</div></div>' +
        '<div class="amt num" style="color:' + (c.drop > 0 ? 'var(--danger)' : 'var(--brand-ink)') + '">' +
        (c.drop > 0 ? '−' : '+') + money(Math.abs(c.drop)) + '</div></button>';
    });
    html += '</div>';
  }

  document.getElementById('view-overview').innerHTML = html;
}

      '<div class="kv"><span class="k">ติ๊กว่าจ่ายแล้ว</span><span class="v num">' + money(paidThis) + '</span></div>' +
      '<div class="kv"><span class="k">ยังไม่จ่าย</span><span class="v num" style="color:' + (totalRecurring - paidThis > 0 ? 'var(--warn)' : 'var(--brand-ink)') + '">' + money(totalRecurring - paidThis) + '</span></div>' +

        '<div class="amt num">' + money(d.remaining) + '</div>' +
        '<button class="icon-btn" data-action="edit-debt" data-id="' + d.id + '" aria-label="แก้ไข ' + esc(d.name) + '">✏️</button>' +

  const misc = envelope(state.miscEnvelopeId);
  html += '<div class="section-title"><span>ตั้งค่า</span></div><div class="card">' +

    '<select data-setting="misc-envelope">' +
      state.envelopes.map(function (e) {
        return '<option value="' + e.id + '"' + (e.id === state.miscEnvelopeId ? ' selected' : '') + '>' +
          esc(e.emoji + ' ' + e.name) + '</option>';
      }).join('') +
    '</select></label>' +
    '<div class="muted" style="margin-top:10px">ตอนนี้ส่วนต่างจะลงที่ ' + esc(misc ? misc.emoji + ' ' + misc.name : '—') + '</div>' +
    '<div class="muted" style="margin-top:14px">ข้อมูลถูกเก็บไว้ในเครื่องนี้เท่านั้น (localStorage) การล้างข้อมูลเบราว์เซอร์จะทำให้ข้อมูลหาย</div>' +

  document.getElementById('view-accounts').innerHTML = html;

let statsRange = 6;
let statsTable = false;

function recentMonths(n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) out.push(shiftMonth(state.activeMonth, -i));
  return out;
}

function renderStats() {
  const months = recentMonths(statsRange);
  const inRange = function (m) { return months.indexOf(m) >= 0; };
  const spentByMonth = months.map(function (m) {
    return state.envelopes.reduce(function (s, e) { return s + spentOf(e.id, m); }, 0);
  });
  const totalSpent = spentByMonth.reduce(function (a, b) { return a + b; }, 0);
  const monthsWithData = spentByMonth.filter(function (v) { return v > 0; }).length;
  const avg = monthsWithData ? totalSpent / monthsWithData : 0;
  const currentBudget = state.envelopes.reduce(function (s, e) { return s + (Number(e.budget) || 0); }, 0);
  const misc = state.envelopes.reduce(function (s, e) {
    return e.id === state.miscEnvelopeId ? s + months.reduce(function (x, m) { return x + spentOf(e.id, m); }, 0) : s;
  }, 0);
  const countsInRange = state.counts.filter(function (c) { return inRange(c.month); });

  let html = '<div class="range">' +
    [3, 6, 12].map(function (n) {
      return '<button class="' + (statsRange === n ? 'on' : '') + '" data-action="stats-range" data-n="' + n + '">' +
        n + ' เดือน</button>';
    }).join('') + '</div>';

  // ---- ตัวเลขหลัก ----
  html += '<div class="tiles">' +
    statTile('จ่ายรวมในช่วงนี้', money(totalSpent), monthsWithData + ' เดือนที่มีข้อมูล') +
    statTile('เฉลี่ยต่อเดือน', money(Math.round(avg)), 'งบตอนนี้ ' + money(currentBudget)) +
    statTile('นับเงินไปแล้ว', countsInRange.length + ' รอบ', state.counts.length + ' รอบทั้งหมด') +
    statTile('ลงจิปาถะ', money(misc), totalSpent > 0 ? Math.round(misc / totalSpent * 100) + '% ของรายจ่าย' : '—') +
  '</div>';

  // ---- สินทรัพย์สุทธิย้อนหลัง ----
  const nwPoints = state.counts
    .filter(function (c) { return typeof c.netWorth === 'number' && inRange(c.month); })
    .map(function (c) {
      return { v: c.netWorth, label: c.date, tick: c.date.slice(5).replace('-', '/') };
    });
  const nowNet = totalAssets() - totalDebts();
  if (!nwPoints.length || nwPoints[nwPoints.length - 1].v !== nowNet) {
    nwPoints.push({ v: nowNet, label: 'ตอนนี้', tick: 'ตอนนี้' });
  }

  html += '<div class="section-title"><span>สินทรัพย์สุทธิย้อนหลัง</span>' +
    '<span class="muted">' + (nwPoints.length > 1 ? nwPoints.length + ' จุด' : '') + '</span></div>' +
    '<div class="card">';
  if (nwPoints.length < 2) {
    html += '<div class="empty">ยังไม่มีประวัติพอจะวาดกราฟ<br>' +
      '<span class="muted">กราฟจะค่อย ๆ เต็มขึ้นทุกครั้งที่กดนับเงิน</span></div>';
  } else if (statsTable) {
    html += dataTable(['เมื่อไหร่', 'สินทรัพย์สุทธิ'], nwPoints.map(function (p) { return [p.label, money(p.v)]; }));
  } else {
    const first = nwPoints[0].v, last = nwPoints[nwPoints.length - 1].v;
    const diff = last - first;
    html += lineChart(nwPoints, { aria: 'สินทรัพย์สุทธิย้อนหลัง ' + statsRange + ' เดือน' }) +
      '<div class="kv" style="margin-top:10px"><span class="k">เปลี่ยนแปลงในช่วงนี้</span>' +
      '<span class="v num" style="color:' + (diff < 0 ? 'var(--danger)' : 'var(--brand-ink)') + '">' +
      (diff > 0 ? '+' : '') + money(diff) + '</span></div>';
  }
  html += '</div>';

  // ---- จ่ายจริงรายเดือน ----
  html += '<div class="section-title"><span>จ่ายจริงรายเดือน</span></div><div class="card">';
  if (totalSpent === 0) {
    html += '<div class="empty">ยังไม่มีรายจ่ายในช่วงนี้</div>';
  } else if (statsTable) {
    html += dataTable(['เดือน', 'จ่ายจริง', 'เทียบงบปัจจุบัน'], months.map(function (m, i) {
      return [monthLabel(m, false), money(spentByMonth[i]),
        currentBudget > 0 ? Math.round(spentByMonth[i] / currentBudget * 100) + '%' : '—'];
    }));
  } else {
    html += columnChart(months.map(function (m, i) {
      return { v: spentByMonth[i], label: monthLabel(m, true), tick: TH_MONTHS[parseInt(m.split('-')[1], 10) - 1] };
    }), { ref: currentBudget, refLabel: 'งบปัจจุบัน ' + shortMoney(currentBudget), aria: 'จ่ายจริงรายเดือน' }) +
    '<div class="muted" style="margin-top:10px">เส้นอ้างอิงคืองบรวม<strong>ปัจจุบัน</strong> ' + esc(money(currentBudget)) +
    ' — แอปไม่ได้เก็บงบย้อนหลังของแต่ละเดือน จึงใช้เทียบคร่าว ๆ เท่านั้น</div>';
  }
  html += '</div>';

  // ---- สัดส่วนตามหมวด ----
  const catColors = ['var(--s1)', 'var(--s2)', 'var(--s3)'];
  const cats = state.categories.map(function (c, i) {
    const v = state.envelopes.reduce(function (s, e) {
      return e.categoryId === c.id ? s + months.reduce(function (x, m) { return x + spentOf(e.id, m); }, 0) : s;
    }, 0);
    return { label: c.name, v: v, color: catColors[i % catColors.length] };
  }).filter(function (c) { return c.v > 0; });

  html += '<div class="section-title"><span>จ่ายตามหมวดหมู่</span></div><div class="card">';
  if (!cats.length) {
    html += '<div class="empty">ยังไม่มีรายจ่ายในช่วงนี้</div>';
  } else if (statsTable) {
    html += dataTable(['หมวด', 'จ่ายจริง', 'สัดส่วน'], cats.map(function (c) {
      return [c.label, money(c.v), Math.round(c.v / totalSpent * 100) + '%'];
    }));
  } else {
    html += stackedBar(cats, totalSpent) +
      '<div class="legend">' + cats.map(function (c) {
        return '<span><i style="background:' + c.color + '"></i>' + esc(c.label) + ' ' +
          money(c.v) + ' (' + Math.round(c.v / totalSpent * 100) + '%)</span>';
      }).join('') + '</div>';
  }
  html += '</div>';

  // ---- ซองที่ใช้เยอะสุด ----
  const top = state.envelopes.map(function (e) {
    return { e: e, v: months.reduce(function (x, m) { return x + spentOf(e.id, m); }, 0) };
  }).filter(function (r) { return r.v > 0; })
    .sort(function (a, b) { return b.v - a.v; }).slice(0, 6);

  html += '<div class="section-title"><span>ซองที่ใช้เยอะสุด</span></div><div class="card">';
  if (!top.length) {
    html += '<div class="empty">ยังไม่มีรายจ่ายในช่วงนี้</div>';
  } else if (statsTable) {
    html += dataTable(['ซอง', 'จ่ายจริง'], top.map(function (r) { return [r.e.name, money(r.v)]; }));
  } else {
    const maxV = top[0].v;
    top.forEach(function (r, i) {
      html += '<div class="catrow"' + (i === 0 ? ' style="margin-top:0"' : '') + '>' +
        '<div class="top"><span class="nm">' + esc(r.e.emoji + ' ' + r.e.name) + '</span>' +
        '<span class="am num">' + money(r.v) + '</span></div>' +
        '<div class="bar"><i style="width:' + (r.v / maxV * 100).toFixed(1) + '%;background:var(--s1)"></i></div></div>';
    });
  }
  html += '</div>';

  // ---- ความละเอียดของการนับ ----
  if (totalSpent > 0) {
    const pct = Math.round(misc / totalSpent * 100);
    html += '<div class="section-title"><span>ความละเอียดของการนับ</span></div><div class="card">' +
      '<div class="kv"><span class="k">ระบุได้ว่าจ่ายอะไร</span><span class="v num">' + (100 - pct) + '%</span></div>' +
      '<div class="meter"><i style="width:' + (100 - pct) + '%"></i></div>' +
      '<div class="muted" style="margin-top:10px">' +
      (pct > 40 ? 'จิปาถะเยอะไปหน่อย — ตอนนับลองติ๊กให้ครบขึ้นอีกนิด จะเห็นภาพว่าเงินไปไหนชัดกว่านี้'
       : pct > 0 ? 'กำลังดี ส่วนใหญ่ระบุได้ว่าจ่ายอะไรไป'
       : 'ระบุได้ครบทุกบาท') + '</div></div>';
  }

  html += '<div class="btn-row"><button class="btn ghost sm" data-action="stats-view">' +
    (statsTable ? '📈 ดูเป็นกราฟ' : '📋 ดูเป็นตาราง') + '</button></div>';

  document.getElementById('view-stats').innerHTML = html;
}

function render() {
  const isNow = state.activeMonth === monthKey(new Date());
  document.getElementById('monthLabel').innerHTML = esc(monthLabel(state.activeMonth, true)) +
    (isNow ? '<span class="today">เดือนนี้</span>' : '');

  if (activeTab === 'overview') renderOverview();
  else if (activeTab === 'envelopes') renderEnvelopes();
  else if (activeTab === 'bills') renderBills();
  else if (activeTab === 'stats') renderStats();
  else renderAccounts();
}

function setTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.view').forEach(function (v) { v.classList.remove('active'); });
  document.getElementById('view-' + tab).classList.add('active');
  document.querySelectorAll('.tabbar button').forEach(function (b) {
    b.setAttribute('aria-selected', String(b.dataset.tab === tab));
  });
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ========================= sheet ========================= */
const sheetEl = document.getElementById('sheet');
const scrimEl = document.getElementById('scrim');

function openSheet(html) {
  sheetEl.innerHTML = '<div class="grabber"></div>' + html;
  sheetEl.classList.add('open');
  scrimEl.classList.add('open');
  sheetEl.scrollTop = 0;
  const first = sheetEl.querySelector('input[data-autofocus]');
  if (first) setTimeout(function () { first.focus(); first.select(); }, 320);
}
function closeSheet() {
  sheetEl.classList.remove('open');
  scrimEl.classList.remove('open');
}
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2400);
}

function accountOptions(selected) {
  const placeholder = '<option value="" disabled' + (selected ? '' : ' selected') + '>เลือกบัญชี…</option>';
  return placeholder + state.owners.map(function (o) {
    const list = state.accounts.filter(function (a) { return a.ownerId === o.id; });
    if (!list.length) return '';
    return '<optgroup label="' + esc(o.name) + '">' + list.map(function (a) {
      return '<option value="' + a.id + '"' + (a.id === selected ? ' selected' : '') + '>' +
        esc(a.emoji + ' ' + a.name) + ' — ' + money(a.balance) + '</option>';
    }).join('') + '</optgroup>';
  }).join('');
}

/* ---- ซอง: บันทึกจ่าย / โยกเงิน / แก้ไข ---- */
function envSheet(envId, mode) {
  const env = envelope(envId);
  if (!env) return;
  const m = state.activeMonth;
  const b = budgetOf(envId, m), s = spentOf(envId, m), l = b - s;
  const st = statusOf(b, s);
  mode = mode || 'spend';

  let html = '<div class="sheet-head">' +
    '<div class="emoji" style="width:46px;height:46px;font-size:22px">' + esc(env.emoji) + '</div>' +
    '<div style="min-width:0;flex:1"><h2>' + esc(env.name) + '</h2>' +
    '<div class="sheet-sub">' + esc(category(env.categoryId) ? category(env.categoryId).name : '') + ' · ' + esc(monthLabel(m, true)) + '</div></div>' +
    '<span class="chip ' + st + '">' + (st === 'over' ? 'เกินงบ' : st === 'warn' ? 'ใกล้เต็ม' : 'ปกติ') + '</span>' +
  '</div>';

  html += '<div class="card is-' + st + '" style="margin-top:14px;background:var(--surface-2)">' +
    '<div class="kv"><span class="k">งบเดือนนี้</span><span class="v num">' + money(b) + '</span></div>' +
    '<div class="kv"><span class="k">จ่ายไปแล้ว</span><span class="v num">' + money(s) + '</span></div>' +
    '<div class="kv"><span class="k">คงเหลือ</span><span class="v num" style="color:' + (l < 0 ? 'var(--danger)' : 'var(--brand-ink)') + '">' + money(l) + '</span></div>' +
    '<div style="margin-top:12px">' + barHTML(s, b) + '</div>' +
  '</div>';

  html += '<div class="seg">' +
    '<button class="' + (mode === 'spend' ? 'on' : '') + '" data-action="env-mode" data-id="' + envId + '" data-mode="spend">💸 บันทึกจ่าย</button>' +
    '<button class="' + (mode === 'move' ? 'on' : '') + '" data-action="env-mode" data-id="' + envId + '" data-mode="move">🔁 โยกเงิน</button>' +
    '<button class="' + (mode === 'edit' ? 'on' : '') + '" data-action="env-mode" data-id="' + envId + '" data-mode="edit">⚙️ แก้ไข</button>' +
  '</div>';

  if (mode === 'spend') {
    html += '<form data-form="spend" data-id="' + envId + '">' +
      '<label class="field"><span>จำนวนเงินที่จ่าย</span>' +
      '<input class="amount" type="number" name="amount" inputmode="decimal" step="0.01" min="0.01" placeholder="0" required data-autofocus></label>' +
      '<label class="field"><span>จ่ายจากบัญชี</span><select name="accountId" required>' + accountOptions(null) + '</select></label>' +
      '<label class="field"><span>โน้ต (ไม่บังคับ)</span><input type="text" name="note" maxlength="80" placeholder="เช่น ข้าวเที่ยง"></label>' +
      '<div class="btn-row"><button type="submit" class="btn">บันทึกรายจ่าย</button></div>' +
    '</form>';

    const hist = state.txns.filter(function (t) { return t.envelopeId === envId && t.month === m; }).reverse();
    html += '<div class="section-title"><span>รายการเดือนนี้ · ' + hist.length + '</span></div><div class="hist">';
    if (!hist.length) html += '<div class="empty">ยังไม่มีรายการจ่ายในเดือนนี้</div>';
    hist.forEach(function (t) {
      const a = account(t.accountId);
      html += '<div class="row"><div style="min-width:0"><div class="nm">' + money(t.amount) + '</div>' +
        '<div class="sub">' + esc(t.date) + (a ? ' · ' + esc(a.name) : '') + (t.note ? ' · ' + esc(t.note) : '') + '</div></div>' +
        '<button class="del" data-action="del-txn" data-id="' + t.id + '" data-env="' + envId + '" aria-label="ลบรายการ">🗑️</button></div>';
    });
    html += '</div>';

  } else if (mode === 'move') {
    const others = state.envelopes.filter(function (e) { return e.id !== envId; });
    html += '<form data-form="move" data-id="' + envId + '">' +
      '<label class="field"><span>จำนวนเงินที่โยกออกจากซองนี้</span>' +
      '<input class="amount" type="number" name="amount" inputmode="decimal" step="0.01" min="0.01" max="' + Math.max(0, l) + '" placeholder="0" required data-autofocus></label>' +
      '<div class="muted" style="margin-top:6px;text-align:center">โยกได้สูงสุด ' + money(Math.max(0, l)) + '</div>' +
      '<label class="field"><span>โยกไปที่ซอง</span><select name="toId" required>' +
        '<option value="" disabled selected>เลือกซองปลายทาง…</option>' +
        state.categories.map(function (c) {
          const list = others.filter(function (e) { return e.categoryId === c.id; });
          if (!list.length) return '';
          return '<optgroup label="' + esc(c.name) + '">' + list.map(function (e) {
            return '<option value="' + e.id + '">' + esc(e.emoji + ' ' + e.name) + ' — เหลือ ' + money(leftOf(e.id, m)) + '</option>';
          }).join('') + '</optgroup>';
        }).join('') +
      '</select></label>' +
      '<div class="btn-row"><button type="submit" class="btn">โยกเงิน</button></div>' +
    '</form>';

    const moves = state.transfers.filter(function (t) {
      return t.month === m && (t.fromEnvelopeId === envId || t.toEnvelopeId === envId);
    }).reverse();
    html += '<div class="section-title"><span>ประวัติการโยกเดือนนี้</span></div><div class="hist">';
    if (!moves.length) html += '<div class="empty">ยังไม่มีการโยกเงินในเดือนนี้</div>';
    moves.forEach(function (t) {
      const out = t.fromEnvelopeId === envId;
      const other = envelope(out ? t.toEnvelopeId : t.fromEnvelopeId);
      html += '<div class="row"><div style="min-width:0">' +
        '<div class="nm">' + (out ? '➖ ' : '➕ ') + money(t.amount) + '</div>' +
        '<div class="sub">' + (out ? 'ไปยัง ' : 'จาก ') + esc(other ? other.name : 'ซองที่ถูกลบ') + ' · ' + esc(t.date) + '</div></div>' +
        '<button class="del" data-action="del-move" data-id="' + t.id + '" data-env="' + envId + '" aria-label="ยกเลิกการโยก">🗑️</button></div>';
    });
    html += '</div>';

  } else {
    html += '<form data-form="env-edit" data-id="' + envId + '">' +
      '<label class="field"><span>อีโมจิ</span><input type="text" name="emoji" maxlength="8" value="' + esc(env.emoji) + '" required></label>' +
      '<label class="field"><span>ชื่อซอง</span><input type="text" name="name" maxlength="60" value="' + esc(env.name) + '" required></label>' +
      '<label class="field"><span>งบประมาณต่อเดือน (บาท)</span>' +
      '<input type="number" name="budget" inputmode="decimal" step="0.01" min="0" value="' + (Number(env.budget) || 0) + '" required></label>' +
      '<label class="field"><span>หมวดหมู่</span><select name="categoryId">' +
        state.categories.map(function (c) {
          return '<option value="' + c.id + '"' + (c.id === env.categoryId ? ' selected' : '') + '>' + esc(c.name) + '</option>';
        }).join('') +
      '</select></label>' +
      '<label class="field"><span>ผู้รับผิดชอบ</span><select name="ownerId">' +
        state.owners.map(function (o) {
          return '<option value="' + o.id + '"' + (o.id === env.ownerId ? ' selected' : '') + '>' + esc(o.name) + '</option>';
        }).join('') +
      '</select></label>' +
      '<label class="field" style="display:flex;align-items:center;gap:10px">' +
        '<input type="checkbox" name="recurring" ' + (env.recurring ? 'checked' : '') + ' style="width:20px;height:20px;accent-color:var(--brand)">' +
        '<span style="margin:0">เป็นบิลรายเดือน (แสดงในตารางบิล)</span>' +
      '</label>' +
      '<div class="btn-grid">' +
        '<button type="button" class="btn danger" data-action="del-env" data-id="' + envId + '">ลบซองนี้</button>' +
        '<button type="submit" class="btn">บันทึก</button>' +
      '</div>' +
    '</form>';
  }

  openSheet(html);
}

/* ---------------- wizard นับเงิน ---------------- */
let countDraft = null;

function startCount() {
  countDraft = { step: 1, balances: {}, paid: {}, miscOverride: null, miscEnvelopeId: state.miscEnvelopeId, note: '' };
  countableAccounts().forEach(function (a) { countDraft.balances[a.id] = Number(a.balance) || 0; });
  countSheet();
}

function countSums() {
  let drop = 0;
  countableAccounts().forEach(function (a) {
    const old = Number(a.balance) || 0;
    const nv = countDraft.balances[a.id];
    const now = (nv === '' || nv === undefined || nv === null) ? old : Number(nv) || 0;
    drop += old - now;
  });
  let ticked = 0;
  Object.keys(countDraft.paid).forEach(function (k) { ticked += Number(countDraft.paid[k]) || 0; });
  drop = Math.round(drop * 100) / 100;
  ticked = Math.round(ticked * 100) / 100;
  const auto = Math.max(0, Math.round((drop - ticked) * 100) / 100);
  const misc = (countDraft.miscOverride === null || countDraft.miscOverride === undefined)
    ? auto : Math.max(0, Number(countDraft.miscOverride) || 0);
  return { drop: drop, ticked: ticked, misc: misc, auto: auto, income: drop < 0 ? -drop : 0 };
}

function countTallyHTML() {
  const s = countSums();
  if (countDraft.step === 1) {
    const total = countableAccounts().reduce(function (sum, a) {
      const nv = countDraft.balances[a.id];
      return sum + ((nv === '' || nv === undefined || nv === null) ? (Number(a.balance) || 0) : Number(nv) || 0);
    }, 0);
    return '<div class="kv"><span class="k">ยอดรวมเฉพาะบัญชีที่นับ</span><span class="v num">' + money(total) + '</span></div>' +
      '<div class="kv"><span class="k">' + (s.drop < 0 ? 'เงินเพิ่มขึ้น' : 'เงินหายไป') + '</span>' +
      '<span class="v num" style="color:' + (s.drop > 0 ? 'var(--danger)' : 'var(--brand-ink)') + '">' + money(Math.abs(s.drop)) + '</span></div>';
  }
  if (countDraft.step === 2) {
    return '<div class="kv"><span class="k">เงินที่หายไป</span><span class="v num">' + money(Math.max(0, s.drop)) + '</span></div>' +
      '<div class="kv"><span class="k">ติ๊กว่าจ่ายแล้ว</span><span class="v num">' + money(s.ticked) + '</span></div>' +
      '<div class="kv"><span class="k">ยังไม่ได้ระบุ</span><span class="v num" style="color:var(--warn)">' + money(s.auto) + '</span></div>';
  }
  return '';
}

function updateCountTally() {
  const el = document.getElementById('countTally');
  if (el) el.innerHTML = countTallyHTML();
}

function countSheet() {
  const step = countDraft.step;
  const month = state.activeMonth;
  const s = countSums();

  let html = '<div class="sheet-head"><div style="flex:1">' +
    '<h2>🧮 นับเงิน</h2>' +
    '<div class="sheet-sub">' +
      (step === 1 ? 'ขั้นที่ 1 — ยอดคงเหลือตอนนี้ของแต่ละบัญชี'
      : step === 2 ? 'ขั้นที่ 2 — จ่ายอะไรไปแล้วบ้าง'
      : 'ขั้นที่ 3 — ตรวจก่อนบันทึก') +
    '</div></div></div>' +
    '<div class="steps"><i class="on"></i><i class="' + (step >= 2 ? 'on' : '') + '"></i><i class="' + (step >= 3 ? 'on' : '') + '"></i></div>';

  if (step < 3) html += '<div class="tally" id="countTally">' + countTallyHTML() + '</div>';

  if (step === 1) {
    const list = countableAccounts();
    if (!list.length) {
      html += '<div class="empty">ยังไม่มีบัญชีที่ตั้งให้นับ<br><span class="muted">เปิดสวิตช์ "นับบัญชีนี้" ได้ที่หน้าบัญชี</span></div>';
    }
    list.forEach(function (a) {
      const old = Number(a.balance) || 0;
      const nv = countDraft.balances[a.id];
      const now = (nv === '' || nv === undefined || nv === null) ? old : Number(nv) || 0;
      const d = now - old;
      html += '<div class="cnt-row">' + accountBadge(a) +
        '<div style="min-width:0"><div class="nm">' + esc(a.name) + '</div>' +
        '<div class="was">เดิม ' + money(old) + '</div></div>' +
        '<div style="margin-left:auto;flex:none">' +
          '<input type="number" inputmode="decimal" step="0.01" data-acc="' + a.id + '" value="' + now + '" aria-label="ยอดของ ' + esc(a.name) + '">' +
          '<div class="delta ' + (d < 0 ? 'down' : d > 0 ? 'up' : '') + '">' + (d === 0 ? 'เท่าเดิม' : (d > 0 ? '+' : '') + money(d)) + '</div>' +
        '</div>' +
      '</div>';
    });
    html += '<div class="btn-grid">' +
      '<button class="btn ghost" data-action="close-sheet">ยกเลิก</button>' +
      '<button class="btn" data-action="count-step" data-step="2">ถัดไป</button>' +

  } else if (step === 2) {
    html += '<div class="muted" style="margin-bottom:10px">แตะเพื่อติ๊กว่าจ่ายแล้ว ยอดที่ขึ้นให้คือยอดงบ กดที่ช่องยอดเพื่อแก้เป็นยอดจริงได้</div>';
    state.categories.forEach(function (c) {
      const list = state.envelopes.filter(function (e) {
        return e.categoryId === c.id && e.id !== countDraft.miscEnvelopeId;
      });
      if (!list.length) return;
      html += '<div class="section-title"><span>' + esc(c.name) + '</span></div>';
      list.forEach(function (e) {
        const budget = budgetOf(e.id, month), already = spentOf(e.id, month);
        const done = budget > 0 && already >= budget;
        const on = countDraft.paid[e.id] !== undefined;
        const val = on ? countDraft.paid[e.id] : Math.max(0, Math.round((budget - already) * 100) / 100);
        html += '<div class="pick' + (on ? ' on' : '') + (done ? ' done' : '') + '"' +
          (done ? '' : ' data-action="count-pick" data-id="' + e.id + '"') + '>' +
          '<span class="box">✓</span>' +
          '<span class="emoji">' + esc(e.emoji) + '</span>' +
          '<span style="min-width:0"><span class="nm">' + esc(e.name) + '</span>' +
          '<span class="sub">' + (done ? 'บันทึกครบงบไปแล้วเดือนนี้' : (already > 0 ? 'บันทึกไปแล้ว ' + money(already) + ' จาก ' + money(budget) : 'งบ ' + money(budget))) + '</span></span>' +
          (done ? '<span class="amt num">' + money(already) + '</span>'
                : '<input class="amt num" type="number" inputmode="decimal" step="0.01" min="0" data-paid="' + e.id + '" value="' + val + '"' +
                  (on ? '' : ' disabled') + ' aria-label="ยอดของ ' + esc(e.name) + '">') +
        '</div>';
      });
    });
    html += '<div class="btn-grid">' +
      '<button class="btn ghost" data-action="count-step" data-step="1">ย้อนกลับ</button>' +
      '<button class="btn" data-action="count-step" data-step="3">ถัดไป</button>' +
    '</div>';

  } else {
    const changed = countableAccounts().filter(function (a) {
      const nv = countDraft.balances[a.id];
      return nv !== undefined && Number(nv) !== (Number(a.balance) || 0);
    });
    const picks = Object.keys(countDraft.paid);

    html += '<div class="card" style="background:var(--surface-2)">' +
      '<div class="kv"><span class="k">' + (s.drop < 0 ? '💰 เงินเพิ่มขึ้น' : '💸 เงินหายไป') + '</span>' +
        '<span class="v num">' + money(Math.abs(s.drop)) + '</span></div>' +
      '<div class="kv"><span class="k">✅ ติ๊กว่าจ่ายแล้ว ' + picks.length + ' รายการ</span><span class="v num">' + money(s.ticked) + '</span></div>' +
      '<div class="kv"><span class="k">🧾 ลงซองจิปาถะ</span><span class="v num" style="color:var(--warn)">' + money(s.misc) + '</span></div>' +
      '<div class="kv"><span class="k">🏦 บัญชีที่ยอดเปลี่ยน</span><span class="v num">' + changed.length + ' บัญชี</span></div>' +
    '</div>';

    if (s.income > 0) {
      html += '<div class="card" style="margin-top:12px;border-color:var(--brand)">' +
        '<div class="muted">ยอดรวมเพิ่มขึ้น ' + money(s.income) + ' — บันทึกเป็นเงินเข้า ไม่ไปหักซองไหน</div></div>';
    }

    html += '<label class="field"><span>ยอดที่จะลงซองจิปาถะ</span>' +
      '<input type="number" inputmode="decimal" step="0.01" min="0" data-misc="1" value="' + s.misc + '"></label>' +
      '<label class="field"><span>ลงซองไหน</span><select data-misc-env="1">' +
        state.envelopes.map(function (e) {
          return '<option value="' + e.id + '"' + (e.id === countDraft.miscEnvelopeId ? ' selected' : '') + '>' +
            esc(e.emoji + ' ' + e.name) + '</option>';
        }).join('') +
      '</select></label>' +
      '<label class="field"><span>โน้ตของการนับรอบนี้ (ไม่บังคับ)</span>' +
      '<input type="text" data-count-note="1" maxlength="80" value="' + esc(countDraft.note || '') + '" placeholder="เช่น นับหลังเงินเดือนออก"></label>';

    html += '<div class="btn-grid">' +
      '<button class="btn ghost" data-action="count-step" data-step="2">ย้อนกลับ</button>' +
      '<button class="btn" data-action="count-save">บันทึกการนับ</button>' +

  openSheet(html);
