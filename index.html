<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#10b981">
<meta name="description" content="แอปทำงบประมาณแบบซอง (Envelope Budgeting) สำหรับวางแผนการเงินครัวเรือน">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="งบซอง">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<title>งบซอง — Envelope Budgeting</title>
<style>
/* ---------- design tokens ---------- */
:root {
  --bg: #eef1f0;
  --surface: #ffffff;
  --surface-2: #f6f8f7;
  --surface-3: #eaefed;
  --text: #10201b;
  --text-2: #5b6b66;
  --text-3: #8a9994;
  --line: #e2e8e6;
  --brand: #10b981;
  --brand-strong: #0d9488;
  --brand-soft: #d9f5ea;
  --brand-ink: #065f46;
  --warn: #f59e0b;
  --warn-soft: #fef3c7;
  --danger: #ef4444;
  --danger-soft: #fee2e2;
  --info: #6366f1;
  --shadow: 0 1px 2px rgba(16, 32, 27, .06), 0 8px 24px rgba(16, 32, 27, .06);
  --shadow-lg: 0 -8px 40px rgba(16, 32, 27, .18);
  --r-sm: 12px;
  --r: 18px;
  --r-lg: 24px;
  --nav-h: 62px;
  --app-w: 480px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1210;
    --surface: #141d1a;
    --surface-2: #1b2521;
    --surface-3: #24302b;
    --text: #eaf2ef;
    --text-2: #a3b3ae;
    --text-3: #7b8b86;
    --line: #26332e;
    --brand: #34d399;
    --brand-strong: #2dd4bf;
    --brand-soft: #10352a;
    --brand-ink: #6ee7b7;
    --warn: #fbbf24;
    --warn-soft: #3a2e0d;
    --danger: #f87171;
    --danger-soft: #3d1a1a;
    --info: #818cf8;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
    --shadow-lg: 0 -8px 40px rgba(0, 0, 0, .55);
  }
}
:root[data-theme="dark"] {
  --bg: #0b1210;
  --surface: #141d1a;
  --surface-2: #1b2521;
  --surface-3: #24302b;
  --text: #eaf2ef;
  --text-2: #a3b3ae;
  --text-3: #7b8b86;
  --line: #26332e;
  --brand: #34d399;
  --brand-strong: #2dd4bf;
  --brand-soft: #10352a;
  --brand-ink: #6ee7b7;
  --warn: #fbbf24;
  --warn-soft: #3a2e0d;
  --danger: #f87171;
  --danger-soft: #3d1a1a;
  --info: #818cf8;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
  --shadow-lg: 0 -8px 40px rgba(0, 0, 0, .55);
}

/* ---------- base ---------- */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Thai", "Sarabun", "Leelawadee UI", "Prompt", Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
h1, h2, h3, p { margin: 0; }
.num { font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

/* ---------- app shell ---------- */
.app {
  max-width: var(--app-w);
  margin: 0 auto;
  min-height: 100%;
  background: var(--bg);
  position: relative;
  box-shadow: 0 0 60px rgba(0, 0, 0, .07);
}
.appbar {
  position: sticky;
  top: 0;
  z-index: 30;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
}
.appbar-row { display: flex; align-items: center; gap: 10px; }
.brandmark {
  width: 34px; height: 34px; flex: none;
  border-radius: 11px;
  background: linear-gradient(135deg, var(--brand), var(--brand-strong));
  color: #fff; font-weight: 700; font-size: 17px;
  display: grid; place-items: center;
}
.appbar h1 { font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
.appbar .sub { font-size: 11.5px; color: var(--text-3); }
.icon-btn {
  width: 38px; height: 38px; flex: none;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  display: grid; place-items: center;
  font-size: 16px;
  transition: transform .15s, background .15s;
}
.icon-btn:active { transform: scale(.92); }

.monthbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-top: 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 4px;
}
.monthbar button {
  width: 40px; height: 34px; border-radius: 10px;
  color: var(--text-2); font-size: 16px;
  transition: background .15s;
}
.monthbar button:active { background: var(--surface-3); }
.monthbar .label { font-weight: 650; font-size: 14.5px; }
.monthbar .today {
  font-size: 11px; color: var(--brand-ink);
  background: var(--brand-soft); border-radius: 999px;
  padding: 1px 8px; margin-left: 6px;
}

main {
  padding: 16px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 26px);
}
.view { display: none; animation: fade .22s ease both; }
.view.active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- bottom nav ---------- */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
  max-width: var(--app-w); margin: 0 auto;
  display: grid; grid-template-columns: repeat(2, 1fr);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar button {
  height: var(--nav-h);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  color: var(--text-3); font-size: 11px; font-weight: 500;
  transition: color .15s;
}
.tabbar button .ic { font-size: 19px; line-height: 1; transition: transform .2s; }
.tabbar button[aria-selected="true"] { color: var(--brand-ink); font-weight: 650; }
.tabbar button[aria-selected="true"] .ic { transform: translateY(-2px) scale(1.08); }

/* ---------- cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  padding: 16px;
}
.card + .card, .stack > * + * { margin-top: 12px; }
.section-title {
  display: flex; align-items: center; justify-content: space-between;
  margin: 22px 2px 10px;
  font-size: 13px; font-weight: 650; color: var(--text-2);
  letter-spacing: .01em;
}
.section-title:first-child { margin-top: 4px; }
.muted { color: var(--text-3); font-size: 12.5px; }

.hero {
  background: linear-gradient(140deg, var(--brand-strong), var(--brand));
  color: #fff; border: none;
  border-radius: var(--r-lg);
  padding: 20px;
  position: relative; overflow: hidden;
}
.hero::after {
  content: ""; position: absolute; right: -50px; top: -60px;
  width: 190px; height: 190px; border-radius: 50%;
  background: rgba(255, 255, 255, .12);
}
.hero.bad { background: linear-gradient(140deg, #b91c1c, #dc2626); }
.hero .lbl { font-size: 12.5px; opacity: .9; }
.hero .big { font-size: 33px; font-weight: 700; margin-top: 2px; letter-spacing: -.02em; }
.hero-split { display: flex; gap: 10px; margin-top: 16px; position: relative; z-index: 1; }
.hero-split > div {
  flex: 1; background: rgba(255, 255, 255, .16);
  border-radius: 14px; padding: 9px 12px;
}
.hero-split .k { font-size: 11.5px; opacity: .92; }
.hero-split .v { font-size: 16px; font-weight: 650; }

/* ---------- ring ---------- */
.ring-wrap { display: flex; align-items: center; gap: 18px; }
.ring { width: 108px; height: 108px; flex: none; position: relative; }
.ring svg { transform: rotate(-90deg); display: block; }
.ring .center {
  position: absolute; inset: 0; display: grid; place-content: center; text-align: center;
}
.ring .pct { font-size: 20px; font-weight: 700; line-height: 1.1; }
.ring .cap { font-size: 10.5px; color: var(--text-3); }
.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.kv + .kv { margin-top: 9px; }
.kv .k { font-size: 13px; color: var(--text-2); }
.kv .v { font-weight: 650; }

/* ---------- bars ---------- */
.bar { height: 8px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: var(--brand); transition: width .45s cubic-bezier(.4, 0, .2, 1); }
.is-warn .bar > i { background: var(--warn); }
.is-over .bar > i { background: var(--danger); }

.catrow + .catrow { margin-top: 14px; }
.catrow .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; gap: 8px; }
.catrow .nm { font-size: 13.5px; font-weight: 600; }
.catrow .am { font-size: 12.5px; color: var(--text-2); }

/* ---------- envelope card ---------- */
.env {
  width: 100%; text-align: left;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); box-shadow: var(--shadow);
  padding: 13px 14px; display: block;
  transition: transform .15s, border-color .15s;
}
.env:active { transform: scale(.985); }
.env + .env { margin-top: 10px; }
.env.is-over { border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); }
.env .head { display: flex; align-items: center; gap: 11px; }
.emoji {
  width: 40px; height: 40px; flex: none; border-radius: 13px;
  background: var(--surface-2); border: 1px solid var(--line);
  display: grid; place-items: center; font-size: 19px;
}
/* ตราธนาคาร: วงกลมสีแบรนด์ + ตัวย่อ */
.badge {
  width: 40px; height: 40px; flex: none; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 800; letter-spacing: -.02em;
  line-height: 1; text-align: center; padding: 2px;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08);
}
.badge.sm { font-size: 10px; }
.badge.xs { font-size: 8.5px; }
.env .nm { font-weight: 600; font-size: 14.5px; line-height: 1.25; overflow-wrap: anywhere; }
.env .sub { font-size: 11.5px; color: var(--text-3); }
.env .right { margin-left: auto; text-align: right; flex: none; }
.env .left-am { font-weight: 700; font-size: 15px; }
.env .of { font-size: 11px; color: var(--text-3); }
.env .bar { margin-top: 11px; }
.is-over .left-am { color: var(--danger); }

.chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10.5px; font-weight: 600;
  padding: 2px 8px; border-radius: 999px;
  background: var(--surface-3); color: var(--text-2);
}
.chip.ok { background: var(--brand-soft); color: var(--brand-ink); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.over { background: var(--danger-soft); color: var(--danger); }

/* ---------- list rows ---------- */
.row {
  display: flex; align-items: center; gap: 11px;
  padding: 11px 0;
}
.row + .row { border-top: 1px solid var(--line); }
.row .nm { font-weight: 550; font-size: 14px; overflow-wrap: anywhere; }
.row .sub { font-size: 11.5px; color: var(--text-3); }
.row .amt { margin-left: auto; font-weight: 650; text-align: right; flex: none; }

.owner-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; margin-bottom: 4px;
}
.owner-head .nm { font-weight: 650; font-size: 14.5px; display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

/* ---------- forms ---------- */
label.field { display: block; margin-top: 14px; }
label.field > span { display: block; font-size: 12.5px; color: var(--text-2); margin-bottom: 6px; font-weight: 550; }
input[type="text"], input[type="number"], select, textarea {
  width: 100%; padding: 12px 14px;
  background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 14px;
  outline: none; transition: border-color .15s, background .15s;
  appearance: none; -webkit-appearance: none;
}
select {
  background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%), linear-gradient(135deg, var(--text-3) 50%, transparent 50%);
  background-position: calc(100% - 19px) 21px, calc(100% - 14px) 21px;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 38px;
}
input:focus, select:focus, textarea:focus { border-color: var(--brand); background: var(--surface); }
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; }
input.amount { font-size: 26px; font-weight: 700; text-align: center; padding: 14px; }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  width: 100%; padding: 14px; border-radius: 15px;
  font-weight: 650; font-size: 15px;
  background: var(--brand); color: #04231a;
  transition: transform .12s, opacity .15s;
}
:root[data-theme="dark"] .btn, :root:not([data-theme="light"]) .btn { color: #04231a; }
.btn:active { transform: scale(.98); }
.btn.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.sm { padding: 11px; font-size: 14px; border-radius: 13px; }
.btn-row { display: flex; gap: 10px; margin-top: 14px; }
.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }

/* ---------- bottom sheet ---------- */
.scrim {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(6, 16, 13, .5);
  backdrop-filter: blur(2px);
  opacity: 0; pointer-events: none; transition: opacity .25s;
}
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; z-index: 51; left: 0; right: 0; bottom: 0;
  max-width: var(--app-w); margin: 0 auto;
  background: var(--surface);
  border-radius: 26px 26px 0 0;
  box-shadow: var(--shadow-lg);
  padding: 8px 18px calc(env(safe-area-inset-bottom) + 22px);
  max-height: 88vh; overflow-y: auto;
  transform: translateY(102%);
  transition: transform .3s cubic-bezier(.32, .72, 0, 1);
}
.sheet.open { transform: none; }
.grabber { width: 40px; height: 4px; border-radius: 999px; background: var(--line); margin: 6px auto 12px; }
.sheet h2 { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.sheet .sheet-sub { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }
.sheet-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 4px; }

.seg { display: flex; gap: 6px; background: var(--surface-2); border-radius: 14px; padding: 4px; margin-top: 14px; }
.seg button {
  flex: 1; padding: 9px 4px; border-radius: 11px;
  font-size: 13px; font-weight: 600; color: var(--text-2);
  transition: background .18s, color .18s;
}
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

/* ---------- นับเงิน ---------- */
.count-cta {
  width: 100%; display: flex; align-items: center; gap: 13px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); box-shadow: var(--shadow);
  padding: 14px; margin-bottom: 12px; text-align: left;
  transition: transform .15s;
}
.count-cta:active { transform: scale(.985); }
.count-cta .ic {
  width: 44px; height: 44px; flex: none; border-radius: 14px;
  background: linear-gradient(140deg, var(--brand), var(--brand-strong));
  display: grid; place-items: center; font-size: 21px;
}
.count-cta .t { display: block; font-weight: 700; font-size: 15.5px; }
.count-cta .s { display: block; font-size: 12px; color: var(--text-3); overflow-wrap: anywhere; }
.count-cta .go { margin-left: auto; color: var(--text-3); font-size: 20px; flex: none; }

.steps { display: flex; gap: 6px; margin: 4px 0 14px; }
.steps i {
  flex: 1; height: 4px; border-radius: 999px; background: var(--surface-3);
  transition: background .25s;
}
.steps i.on { background: var(--brand); }

.tally {
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: 11px 13px; margin-bottom: 12px;
}
.tally .kv .v { font-size: 15px; }

.cnt-row { display: flex; align-items: center; gap: 11px; padding: 9px 0; }
.cnt-row + .cnt-row { border-top: 1px solid var(--line); }
.cnt-row .nm { font-weight: 600; font-size: 13.5px; overflow-wrap: anywhere; }
.cnt-row .was { font-size: 11px; color: var(--text-3); }
.cnt-row input {
  width: 116px; flex: none; margin-left: auto;
  padding: 9px 11px; text-align: right; font-weight: 650;
  font-variant-numeric: tabular-nums; border-radius: 12px;
}
.cnt-row .delta { font-size: 11px; margin-top: 2px; text-align: right; }
.delta.down { color: var(--danger); }
.delta.up { color: var(--brand-ink); }

.pick {
  width: 100%; display: flex; align-items: center; gap: 11px;
  padding: 10px 0; text-align: left;
}
.pick + .pick { border-top: 1px solid var(--line); }
.pick .box {
  width: 24px; height: 24px; flex: none; border-radius: 8px;
  border: 2px solid var(--line); display: grid; place-items: center;
  font-size: 14px; color: transparent; transition: background .15s, border-color .15s, color .15s;
}
.pick.on .box { background: var(--brand); border-color: var(--brand); color: #04231a; }
.pick.done { opacity: .5; }
.pick .nm { display: block; font-weight: 550; font-size: 14px; overflow-wrap: anywhere; }
.pick .sub { display: block; font-size: 11px; color: var(--text-3); }
.pick .amt {
  flex: none; text-align: right;
  font-weight: 650; font-variant-numeric: tabular-nums; font-size: 14px;
}
.pick .amt.done { color: var(--text-3); text-decoration: line-through; }
.pick .box { cursor: pointer; }

/* แถวรายการที่ตั้งงบไว้ */
.budrow { padding: 12px 0; }
.budrow + .budrow { border-top: 1px solid var(--line); }
.budrow .top { display: flex; align-items: center; gap: 11px; margin-bottom: 9px; }
.budrow .nm { display: block; font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.budrow .sub { display: block; font-size: 11.5px; color: var(--text-3); overflow-wrap: anywhere; }
.budrow .spend { width: auto; flex: none; padding: 8px 12px; font-size: 12.5px; }

.row.tap { cursor: pointer; border-radius: 12px; transition: background .15s; }
.row.tap:active { background: var(--surface-2); }
.nudges { display: flex; flex-direction: column; gap: 2px; flex: none; }
.nudges .nudge { width: 26px; height: 22px; font-size: 10px; border-radius: 7px; }
.nudges .nudge:disabled { visibility: hidden; }

/* สวิตช์ */
.switch { display: flex; align-items: center; gap: 11px; padding: 11px 0; }
.switch + .switch { border-top: 1px solid var(--line); }
.switch .lbl { font-size: 13.5px; font-weight: 550; }
.switch .lbl small { display: block; font-weight: 400; font-size: 11.5px; color: var(--text-3); }
.switch .tgl {
  margin-left: auto; flex: none; width: 46px; height: 28px; border-radius: 999px;
  background: var(--surface-3); position: relative; transition: background .2s;
}
.switch .tgl::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 22px; height: 22px; border-radius: 50%; background: var(--surface);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .2s;
}
.switch .tgl.on { background: var(--brand); }
.switch .tgl.on::after { transform: translateX(18px); }

.hist { margin-top: 6px; max-height: 210px; overflow-y: auto; }
.hist .row .del { color: var(--text-3); padding: 6px 8px; border-radius: 9px; font-size: 13px; }
.hist .row .del:active { background: var(--danger-soft); color: var(--danger); }
.empty { text-align: center; color: var(--text-3); font-size: 13px; padding: 22px 10px; }

/* ---------- กราฟ net worth ----------
   ชุดข้อมูลเดียว ใช้สี slot 1 ของ palette ที่ตรวจผ่าน validator
   กับพื้นหลังจริงของแอปทั้งสองโหมด (light #ffffff, dark #141d1a)
   ค่าอ่านได้จากป้ายกำกับและมุมมองตัวเลข ไม่ต้องพึ่งสี */
:root {
  --s1: #2a78d6;
  --grid: #e6ebe9;
  --axis: #c8d2ce;
}

/* ========================= helpers ========================= */
const STORE_KEY = 'envbudget.v1';
const THEME_KEY = 'envbudget.theme';
const TH_MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const TH_MONTHS_FULL = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];

function pad(n) { return n < 10 ? '0' + n : '' + n; }
function monthKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function uid(prefix) { return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

const nf = new Intl.NumberFormat('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
function money(n) {
  const v = Math.round((Number(n) || 0) * 100) / 100;
  return (v < 0 ? '-฿' : '฿') + nf.format(Math.abs(v));
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function monthLabel(key, full) {
  const parts = key.split('-');
  const mi = parseInt(parts[1], 10) - 1;
  const be = parseInt(parts[0], 10) + 543;
  return (full ? TH_MONTHS_FULL[mi] : TH_MONTHS[mi]) + ' ' + be;
}
function shiftMonth(key, step) {
  const parts = key.split('-');
  const d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1 + step, 1);
  return monthKey(d);
}

/* ========================= state ========================= */
let state = load();
let activeTab = 'home';

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return seed();
    const parsed = JSON.parse(raw);
    if (!parsed || !(parsed.schema >= 1)) return seed();
    if (!Array.isArray(parsed.envelopes) && !Array.isArray(parsed.items)) return seed();
    const wasOld = parsed.schema !== 4;
    const s = migrate(parsed);
    // เขียนผลการ migrate กลับทันที ไม่ต้องรอให้ผู้ใช้แตะอะไรก่อน
    // (ยังเรียก save() ไม่ได้ เพราะตัวแปร state ยังไม่ถูกกำหนดค่าตอนนี้)
    if (wasOld) { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {} }
    return s;
  } catch (e) {
    return seed();
  }
}

// อัปข้อมูลเก่าในเครื่องให้เข้ากับสคีมาใหม่ โดยไม่ทิ้งของที่ผู้ใช้กรอกไว้แล้ว
function migrate(s) {
  s.counts = s.counts || [];
  s.owners = s.owners || [];
  s.accounts = s.accounts || [];
  s.activeMonth = s.activeMonth || monthKey(new Date());

  // schema 1–2 เก็บรายจ่ายเป็นรายการย่อย (txns) — ยุบเป็นยอดต่อรายการต่อเดือนก่อน
  if (Array.isArray(s.txns)) {
    s.actuals = s.actuals || {};
    s.txns.forEach(function (t) {
      if (!t || !t.envelopeId || !t.month) return;
      const per = s.actuals[t.envelopeId] || (s.actuals[t.envelopeId] = {});
      per[t.month] = Math.round(((per[t.month] || 0) + (Number(t.amount) || 0)) * 100) / 100;
    });
    delete s.txns;
  }

  // schema ≤3 เรียกรายการว่า "ซอง" และจัดกลุ่มด้วยหมวดหมู่ — รอบนี้ใช้ประเภทแทน
  if (Array.isArray(s.envelopes)) {
    const fixedCats = (s.categories || [])
      .filter(function (c) { return /ประจำ/.test(c.name || ''); })
      .map(function (c) { return c.id; });
    s.items = s.envelopes.map(function (e) {
      return {
        id: e.id, type: fixedCats.indexOf(e.categoryId) >= 0 ? 'fixed' : 'variable',
        ownerId: e.ownerId, emoji: e.emoji, name: e.name,
        budget: Number(e.budget) || 0, linkedAccountId: ''
      };
    });
    delete s.envelopes;
  }
  s.items = s.items || [];

  // actuals เก็บแค่ตัวเลข — ขยายเป็น entry ที่บอกได้ด้วยว่าติ๊กจ่ายแล้วหรือยัง
  if (s.actuals) {
    s.entries = s.entries || {};
    Object.keys(s.actuals).forEach(function (itemId) {
      const item = s.items.find(function (x) { return x.id === itemId; });
      const per = s.entries[itemId] || (s.entries[itemId] = {});
      Object.keys(s.actuals[itemId]).forEach(function (month) {
        const n = Number(s.actuals[itemId][month]) || 0;
        per[month] = { paid: item && item.type === 'fixed' ? n > 0 : false, amount: n, principal: 0, interest: 0 };
      });
    });
    delete s.actuals;
  }
  s.entries = s.entries || {};

  s.accounts.forEach(function (a) {
    if (a.kind === undefined) a.kind = guessKind(a);
    if (a.bankId === undefined) a.bankId = guessBank(a.name);
    if (a.countable === undefined) a.countable = a.kind !== 'receivable';
    if (a.liquid === undefined) a.liquid = LIQUID_BY_DEFAULT.indexOf(a.kind) >= 0;
    if (a.hidden === undefined) a.hidden = false;
    if (a.color === undefined) a.color = '';
    if (a.note === undefined) a.note = '';
    a.balance = Number(a.balance) || 0;
  });

  // หนี้สินเคยเป็นลิสต์แยก — ย้ายมาเป็นบัญชีประเภทหนี้ จะได้นับตอนนับเงินได้ด้วย
  if (Array.isArray(s.debts)) {
    s.debts.forEach(function (d) {
      s.accounts.push({
        id: uid('a'), ownerId: d.ownerId || (s.owners[0] || {}).id, kind: 'debt', bankId: '',
        emoji: '💳', name: d.name || 'หนี้สิน', balance: Number(d.remaining) || 0,
        countable: true, liquid: false, hidden: false, color: '',
        note: d.monthly ? 'ผ่อน ' + d.monthly + '/เดือน' : ''
      });
    });
    delete s.debts;
  }

  // เลิกใช้แล้ว: ตารางบิล · ซองรับส่วนต่าง · หมวดหมู่ · การโยกงบระหว่างซอง
  delete s.bills;
  delete s.miscEnvelopeId;
  delete s.categories;
  delete s.transfers;
  s.items.forEach(function (i) {
    delete i.categoryId; delete i.recurring; delete i.dueDay;
    if (i.type === undefined) i.type = 'variable';
    if (i.linkedAccountId === undefined) i.linkedAccountId = '';
  });

  s.schema = 4;
  return s;
}

function guessKind(a) {
  const e = a.emoji || '';
  if (e.indexOf('🛡') === 0) return 'savings';
  if (e.indexOf('💵') === 0) return 'cash';
  if (e.indexOf('🧾') === 0) return 'receivable';
  if (e.indexOf('📱') === 0 || e.indexOf('🛍') === 0) return 'ewallet';
  if (e.indexOf('🏦') === 0) return 'bank';
  return 'other';
}

function guessBank(name) {
  const n = (name || '').toUpperCase();
  const rules = [
    ['scb', ['SCB', 'ไทยพาณิชย์']], ['kbank', ['KBANK', 'กสิกร']], ['ktb', ['KTB', 'กรุงไทย']],
    ['ttb', ['TTB', 'ทหารไทย', 'ธนชาต']], ['gsb', ['GSB', 'ออมสิน']], ['kkp', ['KKP', 'เกียรตินาคิน']],
    ['bbl', ['BBL', 'กรุงเทพ']], ['bay', ['BAY', 'กรุงศรี']], ['baac', ['BAAC', 'ธ.ก.ส']],
    ['ghb', ['ธอส', 'อาคารสงเคราะห์']], ['uob', ['UOB']], ['cimb', ['CIMB']], ['tisco', ['TISCO']],
    ['truemoney', ['TRUE']], ['shopeepay', ['SHOPEE']], ['linepay', ['LINE PAY', 'RABBIT']]
  ];
  for (let i = 0; i < rules.length; i++) {
    const hit = rules[i][1].some(function (kw) { return n.indexOf(kw.toUpperCase()) >= 0; });
    if (hit) return rules[i][0];
  }
  return '';
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch (e) { toast('บันทึกข้อมูลไม่สำเร็จ (พื้นที่เต็ม)'); }
}

const byId = function (list, id) { return list.find(function (x) { return x.id === id; }) || null; };
const owner = function (id) { return byId(state.owners, id); };
const account = function (id) { return byId(state.accounts, id); };
const category = function (id) { return byId(state.categories, id); };
const bank = function (id) { return BANKS.find(function (b) { return b.id === id; }) || null; };
const kindOf = function (id) { return KINDS.find(function (k) { return k.id === id; }) || KINDS[KINDS.length - 1]; };

// บัญชีที่จะไล่ถามตอนนับเงิน (ตามลำดับที่จัดไว้ในหน้าบัญชี)
function countableAccounts() {
  return state.accounts.filter(function (a) { return a.countable !== false && !a.hidden; });
}
function visibleAccounts(ownerId) {
  return state.accounts.filter(function (a) { return a.ownerId === ownerId; });
}

/* ================= การคำนวณ (รวมศูนย์ที่เดียว) =================
   แกนของแอปคือกระแสเงินสด ไม่ใช่ความมั่งคั่ง:
     เงินสดตอนนี้ − ที่ยังไม่ได้จ่ายของเดือนนี้ = สิ้นเดือนจะเหลือ
   ยอดหนี้ก้อนใหญ่อย่างหนี้บ้านจึงไม่มากลบตัวเลขที่ใช้ตัดสินใจรายเดือน */

const item = function (id) { return byId(state.items, id); };
const isDebt = function (a) { return a && a.kind === 'debt'; };

// entry ของรายการหนึ่งในเดือนหนึ่ง — คืนค่าว่าง ๆ ถ้ายังไม่เคยบันทึก
function entryOf(itemId, month) {
  const per = state.entries[itemId];
  const e = per && per[month];
  return {
    paid: !!(e && e.paid),
    amount: e ? Number(e.amount) || 0 : 0,
    principal: e ? Number(e.principal) || 0 : 0,
    interest: e ? Number(e.interest) || 0 : 0
  };
}

function setEntry(itemId, month, patch) {
  const per = state.entries[itemId] || (state.entries[itemId] = {});
  const cur = entryOf(itemId, month);
  const next = {
    paid: patch.paid === undefined ? cur.paid : !!patch.paid,
    amount: patch.amount === undefined ? cur.amount : Math.round((Number(patch.amount) || 0) * 100) / 100,
    principal: patch.principal === undefined ? cur.principal : Math.round((Number(patch.principal) || 0) * 100) / 100,
    interest: patch.interest === undefined ? cur.interest : Math.round((Number(patch.interest) || 0) * 100) / 100
  };
  if (!next.paid && !next.amount && !next.principal && !next.interest) delete per[month];
  else per[month] = next;
  if (!Object.keys(per).length) delete state.entries[itemId];
}

function budgetOf(itemId) {
  const it = item(itemId);
  return it ? Number(it.budget) || 0 : 0;
}
function spentOf(itemId, month) {
  const it = item(itemId);
  const e = entryOf(itemId, month);
  // รายการแบบติ๊ก ถ้ายังไม่ติ๊กก็ยังไม่นับว่าจ่าย แม้จะเคยกรอกยอดไว้
  if (it && it.type === 'fixed') return e.paid ? (e.amount || budgetOf(itemId)) : 0;
  return e.amount;
}
// ส่วนที่ยังต้องจ่ายของรายการนี้ในเดือนนี้
function remainingOf(itemId, month) {
  const it = item(itemId);
  if (!it) return 0;
  if (it.type === 'fixed') return entryOf(itemId, month).paid ? 0 : budgetOf(itemId);
  return Math.max(0, budgetOf(itemId) - spentOf(itemId, month));
}
function statusOf(budget, spent) {
  if (spent > budget) return 'over';
  if (budget > 0 && spent / budget >= 0.8) return 'warn';
  return 'ok';
}

function itemsOfType(type) {
  return state.items.filter(function (i) { return (i.type || 'variable') === type; });
}

/* ---- ตัวเลขกระแสเงินสด ---- */
function cashNow() {
  return state.accounts.reduce(function (sum, a) {
    return (!isDebt(a) && a.liquid !== false) ? sum + (Number(a.balance) || 0) : sum;
  }, 0);
}
function unpaidOf(month) {
  return state.items.reduce(function (sum, i) { return sum + remainingOf(i.id, month); }, 0);
}
function leftAtMonthEnd(month) { return cashNow() - unpaidOf(month); }

function totals(month) {
  let budget = 0, spent = 0;
  state.items.forEach(function (i) { budget += budgetOf(i.id); spent += spentOf(i.id, month); });
  return { budget: budget, spent: spent, left: budget - spent };
}

function totalAssets() {
  return state.accounts.reduce(function (s, a) { return isDebt(a) ? s : s + (Number(a.balance) || 0); }, 0);
}
function totalDebts() {
  return state.accounts.reduce(function (s, a) { return isDebt(a) ? s + (Number(a.balance) || 0) : s; }, 0);
}
function assetsOfOwner(ownerId) {
  return state.accounts.reduce(function (s, a) {
    return (a.ownerId === ownerId && !isDebt(a)) ? s + (Number(a.balance) || 0) : s;
  }, 0);
}
function debtsOfOwner(ownerId) {
  return state.accounts.reduce(function (s, a) {
    return (a.ownerId === ownerId && isDebt(a)) ? s + (Number(a.balance) || 0) : s;
  }, 0);
}

/* ========================= actions ========================= */

/* บันทึกสิ่งที่จ่ายไปแล้วของรายการหนึ่งในเดือนหนึ่ง
   ทั้งหมดนี้เป็นข้อมูลสถานะ ไม่ไปแตะยอดบัญชี — ยอดบัญชีมาจากการนับเงินเท่านั้น */
function recordItem(itemId, month, patch) {
  setEntry(itemId, month, patch);
  save();
}

function toggleItemPaid(itemId, month) {
  const cur = entryOf(itemId, month);
  const next = !cur.paid;
  setEntry(itemId, month, { paid: next, amount: next ? (cur.amount || budgetOf(itemId)) : cur.amount });
  save();
  return next;
}

/* ---------------- นับเงิน = snapshot ยอดบัญชี ---------------- */

// บันทึกยอดบัญชีที่นับได้ พร้อมเก็บเงินสด ณ ตอนนั้นไว้วาดกราฟกระแสเงินสด
function saveCount(draft) {
  const before = {}, balances = {};
  let diff = 0;

  countableAccounts().forEach(function (a) {
    const nv = draft.balances[a.id];
    const oldV = Number(a.balance) || 0;
    const newV = (nv === undefined || nv === null || nv === '') ? oldV : Number(nv) || 0;
    before[a.id] = oldV;
    balances[a.id] = newV;
    diff += newV - oldV;
  });

  Object.keys(balances).forEach(function (accId) {
    const acc = account(accId);
    if (acc) acc.balance = balances[accId];
  });

  const assets = totalAssets(), debts = totalDebts(), cash = cashNow();
  state.counts.push({
    id: uid('c'), date: todayISO(), month: state.activeMonth,
    before: before, balances: balances,
    cash: cash, assets: assets, debts: debts, netWorth: assets - debts,
    note: draft.note || ''
  });
  save();
  return { diff: Math.round(diff * 100) / 100, cash: cash };
}

// ลบ snapshot — ถ้าเป็นตัวล่าสุดจะคืนยอดบัญชีกลับไปเป็นก่อนนับให้ด้วย
function removeCount(countId) {
  const i = state.counts.findIndex(function (c) { return c.id === countId; });
  if (i < 0) return false;
  const isLatest = i === state.counts.length - 1;
  if (isLatest) {
    const c = state.counts[i];
    Object.keys(c.before || {}).forEach(function (accId) {
      const acc = account(accId);
      if (acc) acc.balance = c.before[accId];
    });
  }
  state.counts.splice(i, 1);
  save();
  return isLatest;
}

function lastCount() { return state.counts.length ? state.counts[state.counts.length - 1] : null; }

function daysSince(iso) {
  const then = new Date(iso + 'T00:00:00');
  const now = new Date(todayISO() + 'T00:00:00');
  return Math.round((now - then) / 86400000);
}

/* ========================= UI bits ========================= */
function ring(pct, label) {
  const r = 46, c = 2 * Math.PI * r;
  const clamped = Math.max(0, Math.min(1, pct));
  const color = pct > 1 ? 'var(--danger)' : (pct >= 0.8 ? 'var(--warn)' : 'var(--brand)');
  return '<div class="ring">' +
    '<svg width="108" height="108" viewBox="0 0 108 108" aria-hidden="true">' +
      '<circle cx="54" cy="54" r="' + r + '" fill="none" stroke="var(--surface-3)" stroke-width="11"/>' +
      '<circle cx="54" cy="54" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="11" stroke-linecap="round" ' +
        'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + (c * (1 - clamped)).toFixed(1) + '"/>' +
    '</svg>' +
    '<div class="center"><div class="pct num">' + Math.round(pct * 100) + '%</div><div class="cap">' + label + '</div></div>' +
  '</div>';
}
function barHTML(spent, budget) {
  const pct = budget > 0 ? Math.min(1, spent / budget) : (spent > 0 ? 1 : 0);
  return '<div class="bar"><i style="width:' + (pct * 100).toFixed(1) + '%"></i></div>';
}

// ตราประจำบัญชี: ธนาคาร/วอลเล็ตใช้วงกลมสีแบรนด์ + ตัวย่อ, ที่เหลือใช้อีโมจิตามประเภท
function accountBadge(a) {
  const b = bank(a.bankId);
  const color = a.color || (b ? b.color : '');
  if (color) {
    const label = b ? b.abbr : (a.name || '?').trim().slice(0, 4);
    const ink = (!a.color && b && b.ink) ? b.ink : '#ffffff';
    const size = label.length > 4 ? ' xs' : (label.length > 3 ? ' sm' : '');
    return '<span class="badge' + size + '" style="background:' + esc(color) + ';color:' + ink + '">' + esc(label) + '</span>';
  }
  return '<span class="emoji">' + esc(a.emoji || kindOf(a.kind).emoji) + '</span>';
}

/* ========================= กราฟ (SVG เขียนเอง ไม่พึ่งไลบรารี) =========================
   ทุกกราฟมีป้ายค่ากำกับให้อ่านได้โดยไม่ต้องพึ่งสี และมีมุมมองตารางสลับได้
   ตามข้อกำหนดการเข้าถึง — สีเป็นช่องทางเสริม ไม่ใช่ช่องทางเดียว */

function shortMoney(n) {
  const v = Math.abs(n);
  if (v >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'ล.';
  if (v >= 1000) return Math.round(n / 1000) + 'พ.';
  return String(Math.round(n));
}

// กราฟเส้น — ใช้กับข้อมูลชุดเดียวที่เดินตามเวลา จึงไม่ต้องมีคำอธิบายสี
function lineChart(points, opts) {
  opts = opts || {};
  const W = 320, H = 150, L = 8, R = 8, T = 16, B = 22;
  const pw = W - L - R, ph = H - T - B;
  const vals = points.map(function (p) { return p.v; });
  let min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if (min === max) { min -= 1; max += 1; }
  const pad = (max - min) * 0.15;
  min -= pad; max += pad;
  const x = function (i) { return L + (points.length === 1 ? pw / 2 : pw * i / (points.length - 1)); };
  const y = function (v) { return T + ph - ph * (v - min) / (max - min); };

  let g = '';
  for (let i = 0; i <= 2; i++) {
    const yy = T + ph * i / 2;
    g += '<line class="gridline" x1="' + L + '" y1="' + yy.toFixed(1) + '" x2="' + (W - R) + '" y2="' + yy.toFixed(1) + '"/>';
  }
  const d = points.map(function (p, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1); }).join(' ');
  const area = d + ' L' + x(points.length - 1).toFixed(1) + ' ' + (T + ph) + ' L' + x(0).toFixed(1) + ' ' + (T + ph) + ' Z';

  let marks = '<path d="' + area + '" fill="var(--s1)" opacity=".10"/>' +
    '<path d="' + d + '" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
  points.forEach(function (p, i) {
    marks += '<circle class="dot" cx="' + x(i).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="4" fill="var(--s1)"/>';
    marks += '<circle class="hit" cx="' + x(i).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="16" ' +
      'data-tip="' + esc(p.label + ' · ' + money(p.v)) + '"/>';
  });
  // ป้ายค่าเฉพาะจุดล่าสุด ไม่ใส่ทุกจุดเพราะจะรกและไม่มีใครอ่าน
  const lastI = points.length - 1;
  const lx = Math.min(W - R - 2, Math.max(L + 2, x(lastI)));
  marks += '<text class="vlabel" x="' + lx.toFixed(1) + '" y="' + Math.max(10, y(points[lastI].v) - 9).toFixed(1) + '" ' +
    'text-anchor="' + (lastI === 0 ? 'middle' : 'end') + '">' + esc(money(points[lastI].v)) + '</text>';

  let ticks = '';
  points.forEach(function (p, i) {
    if (points.length > 6 && i % 2) return;
    ticks += '<text class="tick" x="' + x(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(p.tick) + '</text>';
  });

  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opts.aria || '') + '">' +
    g + marks +
    '<line class="axisline" x1="' + L + '" y1="' + (T + ph) + '" x2="' + (W - R) + '" y2="' + (T + ph) + '"/>' +
    ticks + '</svg>';
}

/* ========================= views ========================= */

/* checklist ของเดือน — ใช้ทั้งบนหน้าแรกและในขั้นที่ 2 ของการนับเงิน
   compact = true คือเวอร์ชันในชีตนับเงิน (ไม่มีปุ่มเพิ่ม/แก้รายการ) */
function checklistHTML(m, compact) {
  const fixed = itemsOfType('fixed'), variable = itemsOfType('variable');
  let html = '';

  html += '<div class="section-title"><span>ต้องจ่ายประจำ</span>' +
    '<span class="muted num">ยังไม่จ่าย ' + money(fixed.reduce(function (a, i) { return a + remainingOf(i.id, m); }, 0)) + '</span></div>' +
    '<div class="card">';
  if (!fixed.length) html += '<div class="empty">ยังไม่มีรายการ</div>';
  fixed.forEach(function (i, idx) {
    const e = entryOf(i.id, m);
    const amt = e.paid ? (e.amount || budgetOf(i.id)) : budgetOf(i.id);
    const linked = account(i.linkedAccountId);
    const ownerName = owner(i.ownerId) ? owner(i.ownerId).name : '';
    const bits = [];
    if (e.paid && (e.principal || e.interest)) {
      bits.push('เงินต้น ' + money(e.principal) + ' · ดอกเบี้ย ' + money(e.interest));
    } else if (linked) {
      bits.push('ผูกกับ ' + linked.name);
    }
    if (ownerName) bits.push(ownerName);
    html += '<div class="pick' + (e.paid ? ' on' : '') + '"' + (idx === 0 ? ' style="padding-top:0"' : '') + '>' +
      '<button class="box" data-action="toggle-item" data-id="' + i.id + '" ' +
        'aria-pressed="' + e.paid + '" aria-label="ติ๊กว่าจ่าย ' + esc(i.name) + '">✓</button>' +
      '<span class="emoji">' + esc(i.emoji) + '</span>' +
      '<span style="min-width:0;flex:1"><span class="nm">' + esc(i.name) + '</span>' +
      (bits.length ? '<span class="sub">' + esc(bits.join(' · ')) + '</span>' : '') + '</span>' +
      '<span class="amt num' + (e.paid ? ' done' : '') + '">' + money(amt) + '</span>' +
      '<button class="icon-btn" data-action="edit-item" data-id="' + i.id + '" ' +
        'aria-label="แก้ไข ' + esc(i.name) + '">✏️</button>' +
    '</div>';
  });
  html += '</div>';

  html += '<div class="section-title"><span>มีงบไว้ใช้</span>' +
    '<span class="muted num">เหลือใช้ ' + money(variable.reduce(function (a, i) { return a + remainingOf(i.id, m); }, 0)) + '</span></div>' +
    '<div class="card">';
  if (!variable.length) html += '<div class="empty">ยังไม่มีรายการ</div>';
  variable.forEach(function (i, idx) {
    const b = budgetOf(i.id), sp = spentOf(i.id, m), rest = b - sp;
    const st = statusOf(b, sp);
    const ownerName = owner(i.ownerId) ? owner(i.ownerId).name : '';
    const subParts = ['ใช้ไป ' + money(sp) + ' จาก ' + money(b) + ' · ' +
      (rest >= 0 ? 'เหลือให้ใช้อีก ' + money(rest) : 'เกินงบ ' + money(-rest))];
    if (ownerName) subParts.push(ownerName);
    html += '<div class="budrow is-' + st + '"' + (idx === 0 ? ' style="margin-top:0"' : '') + '>' +
      '<div class="top">' +
        '<span class="emoji">' + esc(i.emoji) + '</span>' +
        '<span style="min-width:0;flex:1"><span class="nm">' + esc(i.name) + '</span>' +
        '<span class="sub">' + esc(subParts.join(' · ')) + '</span></span>' +
        '<button class="btn ghost sm spend" data-action="edit-item" data-id="' + i.id + '">ใส่ยอด</button>' +
      '</div>' + barHTML(sp, b) +
    '</div>';
  });
  html += '</div>';

  if (!compact) {
    html += '<div class="btn-row"><button class="btn ghost sm" data-action="add-item">➕ เพิ่มรายการ</button></div>';
  }
  return html;
}

function renderAccounts() {
  const assets = totalAssets(), debts = totalDebts(), cash = cashNow();
  let html = '<div class="card hero">' +
    '<div class="lbl">💵 เงินสดที่ใช้ได้</div>' +
    '<div class="big num">' + money(cash) + '</div>' +
    '<div class="hero-split"><div><div class="k">💰 สินทรัพย์รวม</div><div class="v num">' + money(assets) + '</div></div>' +
    '<div><div class="k">💳 หนี้สินรวม</div><div class="v num">' + money(debts) + '</div></div></div>' +
  '</div>';

  state.owners.forEach(function (o) {
    const list = visibleAccounts(o.id);
    html += '<div class="section-title"><span style="display:flex;align-items:center;gap:8px">' +
      '<span class="dot" style="background:' + o.color + '"></span>' + esc(o.name) +
      '<button class="icon-btn" style="width:26px;height:26px;font-size:12px" data-action="edit-owner" data-id="' + o.id + '" aria-label="แก้ไข ' + esc(o.name) + '">✏️</button></span>' +
      '<span class="muted num">' + money(assetsOfOwner(o.id)) +
      (debtsOfOwner(o.id) ? ' · หนี้ ' + money(debtsOfOwner(o.id)) : '') + '</span></div><div class="card">';
    if (!list.length) {
      html += '<div class="empty">ยังไม่มีบัญชี</div>';
    } else {
      list.forEach(function (a, i) {
        const k = kindOf(a.kind);
        const b = bank(a.bankId);
        // คำบรรยายใต้ชื่อ — ตัดส่วนที่ซ้ำกับชื่อบัญชีออก จะได้ไม่ขึ้น "กสิกรไทย / กสิกรไทย"
        const tags = [];
        const bankName = b ? b.name.replace(/\s*\(.*\)$/, '') : '';
        if (bankName && bankName !== a.name) tags.push(bankName);
        else if (!b && k.name !== a.name) tags.push(k.name);
        if (a.note) tags.push(a.note);
        if (!isDebt(a) && a.liquid === false) tags.push('ไม่นับเป็นเงินสด');
        if (a.countable === false) tags.push('ไม่นับตอนนับเงิน');
        if (a.hidden) tags.push('ซ่อน');

        const rowStyle = (i === 0 ? 'padding-top:0;' : '') + (a.hidden ? 'opacity:.5;' : '');
        const arrow = function (dir, label, glyph, off) {
          return '<button class="icon-btn nudge" data-action="move-account" data-id="' + a.id + '" data-dir="' + dir + '"' +
            ' aria-label="' + label + '"' + (off ? ' disabled' : '') + '>' + glyph + '</button>';
        };
        // ทั้งแถวกดเพื่อแก้ไขได้ ปุ่มลูกศรที่ซ้อนอยู่จะถูกจับก่อนเพราะอยู่ใกล้กว่า
        html += '<div class="row tap" data-action="edit-account" data-id="' + a.id + '" role="button" ' +
          'aria-label="แก้ไข ' + esc(a.name) + '"' + (rowStyle ? ' style="' + rowStyle + '"' : '') + '>' +
          accountBadge(a) +
          '<div style="min-width:0"><div class="nm">' + esc(a.name) + '</div>' +
          (tags.length ? '<div class="sub">' + esc(tags.join(' · ')) + '</div>' : '') + '</div>' +
          '<div class="amt num"' + (isDebt(a) ? ' style="color:var(--danger)"' : '') + '>' +
            (isDebt(a) ? '−' : '') + money(a.balance) + '</div>' +
          '<div class="nudges">' +
            arrow(-1, 'เลื่อนขึ้น', '▲', i === 0) +
            arrow(1, 'เลื่อนลง', '▼', i === list.length - 1) +
          '</div>' +
        '</div>';
      });
    }
    html += '</div>';
  });

  html += '<div class="btn-grid">' +
    '<button class="btn ghost sm" data-action="add-account">➕ เพิ่มบัญชี</button>' +
    '<button class="btn ghost sm" data-action="add-owner">👤 เพิ่มเจ้าของ</button>' +
  '</div>';

  html += '<div class="section-title"><span>สรุป</span></div><div class="card">' +
    '<div class="kv"><span class="k">เงินสดที่ใช้ได้</span><span class="v num">' + money(cash) + '</span></div>' +
    '<div class="kv"><span class="k">สินทรัพย์รวม</span><span class="v num">' + money(assets) + '</span></div>' +
    '<div class="kv"><span class="k">หนี้สินรวม</span><span class="v num" style="color:var(--danger)">' + money(debts) + '</span></div>' +
    '<div class="kv"><span class="k">สินทรัพย์สุทธิ</span><span class="v num">' + money(assets - debts) + '</span></div>' +
    '<div class="muted" style="margin-top:10px">หนี้ก้อนใหญ่อย่างหนี้บ้านทำให้ตัวเลขสุทธิไม่บอกอะไรเรื่องเงินใช้จ่ายรายเดือน ' +
    'หน้าแรกจึงใช้เงินสดเป็นหลัก</div>' +
  '</div>';

  html += '<div class="section-title"><span>ตั้งค่า</span></div><div class="card">' +
    '<div class="muted" style="margin-top:14px">ข้อมูลถูกเก็บไว้ในเครื่องนี้เท่านั้น (localStorage) การล้างข้อมูลเบราว์เซอร์จะทำให้ข้อมูลหาย</div>' +
    '<div class="btn-row"><button class="btn danger sm" data-action="reset">↺ รีเซ็ตกลับค่าเริ่มต้นจากชีต</button></div>' +
  '</div>';

  document.getElementById('view-accounts').innerHTML = html;
}

function render() {
  const isNow = state.activeMonth === monthKey(new Date());
  document.getElementById('monthLabel').innerHTML = esc(monthLabel(state.activeMonth, true)) +
    (isNow ? '<span class="today">เดือนนี้</span>' : '');

  if (activeTab === 'home') renderHome();
  else renderAccounts();
}

function setTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.view').forEach(function (v) { v.classList.remove('active'); });
  document.getElementById('view-' + tab).classList.add('active');
  document.querySelectorAll('.tabbar button').forEach(function (b) {
    b.setAttribute('aria-selected', String(b.dataset.tab === tab));
  });
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ========================= sheet ========================= */
const sheetEl = document.getElementById('sheet');
const scrimEl = document.getElementById('scrim');

function openSheet(html) {
  sheetEl.innerHTML = '<div class="grabber"></div>' + html;
  sheetEl.classList.add('open');
  scrimEl.classList.add('open');
  sheetEl.scrollTop = 0;
  const first = sheetEl.querySelector('input[data-autofocus]');
  if (first) setTimeout(function () { first.focus(); first.select(); }, 320);
}
function closeSheet() {
  sheetEl.classList.remove('open');
  scrimEl.classList.remove('open');
}
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2400);
}

/* ---------------- นับเงิน (หน้าเดียว) ---------------- */
let countDraft = null;

function startCount() {
  countDraft = { step: 1, balances: {}, note: '' };
  countableAccounts().forEach(function (a) { countDraft.balances[a.id] = Number(a.balance) || 0; });
  countSheet();
}

function countTotals() {
  let now = 0, was = 0;
  countableAccounts().forEach(function (a) {
    const old = Number(a.balance) || 0;
    const nv = countDraft.balances[a.id];
    was += old;
    now += (nv === '' || nv === undefined || nv === null) ? old : Number(nv) || 0;
  });
  return { now: Math.round(now * 100) / 100, diff: Math.round((now - was) * 100) / 100 };
}

function countTallyHTML() {
  const t = countTotals();
  const other = totalAssets() - countableAccounts().reduce(function (s, a) { return s + (Number(a.balance) || 0); }, 0);
  return '<div class="kv"><span class="k">รวมบัญชีที่นับ</span><span class="v num">' + money(t.now) + '</span></div>' +
    (other !== 0 ? '<div class="kv"><span class="k">บัญชีที่ไม่ได้นับ</span><span class="v num">' + money(other) + '</span></div>' : '') +
    '<div class="kv"><span class="k">สินทรัพย์สุทธิหลังบันทึก</span><span class="v num">' +
      money(t.now + other - totalDebts()) + '</span></div>' +
    '<div class="kv"><span class="k">ต่างจากครั้งก่อน</span>' +
      '<span class="v num" style="color:' + (t.diff < 0 ? 'var(--danger)' : 'var(--brand-ink)') + '">' +
      (t.diff > 0 ? '+' : '') + money(t.diff) + '</span></div>';
}

function updateCountTally() {
  const el = document.getElementById('countTally');
  if (el) el.innerHTML = countTallyHTML();
}

function countSheet() {
  const step = countDraft.step || 1;
  const list = countableAccounts();

  let html = '<div class="sheet-head"><div style="flex:1">' +
    '<h2>🧮 นับเงิน</h2>' +
    '<div class="sheet-sub">' +
      (step === 1 ? 'ขั้นที่ 1 — ยอดคงเหลือจริงของแต่ละบัญชีตอนนี้'
                  : 'ขั้นที่ 2 — จ่ายอะไรไปแล้วบ้างเดือนนี้') +
    '</div></div></div>' +
    '<div class="steps"><i class="on"></i><i class="' + (step >= 2 ? 'on' : '') + '"></i></div>';

  if (step === 1) {
    html += '<div class="tally" id="countTally">' + countTallyHTML() + '</div>';
    if (!list.length) {
      html += '<div class="empty">ยังไม่มีบัญชีที่ตั้งให้นับ<br>' +
        '<span class="muted">เปิดสวิตช์ "นับบัญชีนี้" ได้ที่หน้าบัญชี</span></div>';
    }
    list.forEach(function (a) {
      const old = Number(a.balance) || 0;
      const nv = countDraft.balances[a.id];
      const now = (nv === '' || nv === undefined || nv === null) ? old : Number(nv) || 0;
      const d = now - old;
      const ownerName = owner(a.ownerId) ? owner(a.ownerId).name : '';
      html += '<div class="cnt-row">' + accountBadge(a) +
        '<div style="min-width:0"><div class="nm">' + esc(a.name) + (ownerName ? ' <span class="muted">(' + esc(ownerName) + ')</span>' : '') + '</div>' +
        '<div class="was">' + (isDebt(a) ? 'ยอดหนี้เดิม ' : 'เดิม ') + money(old) + '</div></div>' +
        '<div style="margin-left:auto;flex:none">' +
          '<input type="number" inputmode="decimal" step="0.01" data-acc="' + a.id + '" value="' + now + '" aria-label="ยอดของ ' + esc(a.name) + '">' +
          '<div class="delta ' + (d < 0 ? 'down' : d > 0 ? 'up' : '') + '">' + (d === 0 ? 'เท่าเดิม' : (d > 0 ? '+' : '') + money(d)) + '</div>' +
        '</div>' +
      '</div>';
    });
    html += '<div class="btn-grid">' +
      '<button class="btn ghost" data-action="close-sheet">ยกเลิก</button>' +
      '<button class="btn" data-action="count-step" data-step="2">ถัดไป</button>' +
    '</div>';

  } else {
    html += checklistHTML(state.activeMonth, true);
    html += '<label class="field"><span>โน้ต (ไม่บังคับ)</span>' +
      '<input type="text" data-count-note="1" maxlength="80" value="' + esc(countDraft.note || '') + '" placeholder="เช่น นับหลังเงินเดือนออก"></label>' +
      '<div class="btn-grid">' +
        '<button class="btn ghost" data-action="count-step" data-step="1">ย้อนกลับ</button>' +
        '<button class="btn" data-action="count-save">บันทึก</button>' +
      '</div>';
  }

  openSheet(html);
}

function countDetailSheet(countId) {
  const c = byId(state.counts, countId);
  if (!c) return;
  const isLatest = state.counts[state.counts.length - 1] === c;
  const balances = c.balances || c.after || {};

  let html = '<div class="sheet-head"><div style="flex:1"><h2>นับเมื่อ ' + esc(c.date) + '</h2>' +
    '<div class="sheet-sub">' + (c.note ? esc(c.note) : 'ภาพทรัพย์สิน ณ เวลานั้น') + '</div></div></div>' +
    '<div class="card" style="margin-top:12px;background:var(--surface-2)">' +
      '<div class="kv"><span class="k">สินทรัพย์รวม</span><span class="v num">' + money(c.assets) + '</span></div>' +
      '<div class="kv"><span class="k">หนี้สินรวม</span><span class="v num">' + money(c.debts) + '</span></div>' +
      '<div class="kv"><span class="k">สินทรัพย์สุทธิ</span><span class="v num">' + money(c.netWorth) + '</span></div>' +
    '</div>';

  html += '<div class="section-title"><span>ยอดบัญชีที่นับ</span></div><div class="hist">';
  const keys = Object.keys(balances);
  if (!keys.length) html += '<div class="empty">ไม่มีข้อมูลบัญชีของรอบนี้</div>';
  keys.forEach(function (accId) {
    const a = account(accId);
    if (!a) return;
    const bfr = (c.before || {})[accId];
    const d = bfr === undefined ? null : balances[accId] - bfr;
    html += '<div class="row">' + accountBadge(a) +
      '<div style="min-width:0"><div class="nm">' + esc(a.name) + '</div>' +
      (d === null ? '' : '<div class="sub">' + money(bfr) + ' → ' + money(balances[accId]) + '</div>') + '</div>' +
      '<div class="amt num">' + money(balances[accId]) + '</div></div>';
  });
  html += '</div>';

  html += '<div class="btn-grid">' +
    '<button class="btn danger" data-action="del-count" data-id="' + c.id + '">ลบรายการนี้</button>' +
    '<button class="btn ghost" data-action="close-sheet">ปิด</button>' +
  '</div>' +
  (isLatest ? '<div class="muted" style="margin-top:10px;text-align:center">ลบรายการล่าสุดจะคืนยอดบัญชีกลับไปเป็นก่อนนับให้ด้วย</div>' : '');
  openSheet(html);
}

function confirmSheet(title, desc, actionAttr) {
  openSheet('<div class="sheet-head"><div style="flex:1"><h2>' + esc(title) + '</h2>' +
    '<div class="sheet-sub">' + esc(desc) + '</div></div></div>' +
    '<div class="btn-grid"><button class="btn ghost" data-action="close-sheet">ยกเลิก</button>' +
    '<button class="btn danger" ' + actionAttr + '>ยืนยัน</button></div>');
}

/* ========================= events ========================= */
document.addEventListener('click', function (ev) {
  // แตะช่องกรอก/ดรอปดาวน์ที่อยู่ในแถวซึ่งกดได้ ต้องไม่ไปสั่ง action ของแถวนั้น
  const tag = ev.target.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || tag === 'LABEL') return;
  const el = ev.target.closest('[data-action]');
  if (!el) return;
  const act = el.dataset.action;
  const id = el.dataset.id;

  if (act === 'tab') { setTab(el.dataset.tab); return; }

  if (act === 'month') {
    state.activeMonth = shiftMonth(state.activeMonth, parseInt(el.dataset.step, 10));
    save(); render(); return;
  }

  if (act === 'toggle-theme') {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : cur === 'light' ? 'dark' :
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    toast(next === 'dark' ? 'โหมดมืด' : 'โหมดสว่าง');
    return;
  }

  if (act === 'close-sheet') { closeSheet(); return; }
  if (act === 'edit-item') { itemSheet(id, 'record'); return; }
  if (act === 'item-mode') { itemSheet(id, el.dataset.mode); return; }
  if (act === 'add-item') { addItemSheet(); return; }

  if (act === 'toggle-item') {
    toggleItemPaid(id, state.activeMonth);
    if (el.dataset.stay) itemSheet(id, 'record');
    else if (countDraft) countSheet();
    render();
    return;
  }

  if (act === 'del-item') {
    confirmSheet('ลบรายการนี้?', 'ประวัติที่บันทึกไว้ของรายการนี้จะถูกลบด้วย',
      'data-action="del-item-confirm" data-id="' + id + '"');
    return;
  }
  if (act === 'del-item-confirm') {
    state.items = state.items.filter(function (i) { return i.id !== id; });
    delete state.entries[id];
    save(); closeSheet(); render(); toast('ลบรายการแล้ว');
    return;
  }
  if (act === 'add-account') { accountSheet(null); return; }
  if (act === 'edit-account') { accountSheet(id); return; }
  if (act === 'add-owner') { ownerSheet(null); return; }
  if (act === 'edit-owner') { ownerSheet(id); return; }

  if (act === 'cash-view') { cashTable = !cashTable; renderHome(); return; }

  if (act === 'start-count') { startCount(); return; }
  if (act === 'open-count') { countDetailSheet(id); return; }

  if (act === 'count-step') {
    countDraft.step = parseInt(el.dataset.step, 10);
    countSheet();
    return;
  }

  if (act === 'count-save') {
    const res = saveCount(countDraft);
    countDraft = null;
    closeSheet(); render();
    toast('บันทึกแล้ว · เงินสด ' + money(res.cash));
    return;
  }

  if (act === 'del-count') {
    const isLatest = state.counts.length && state.counts[state.counts.length - 1].id === id;
    confirmSheet('ลบรายการนับนี้?',
      isLatest ? 'ยอดบัญชีจะกลับไปเป็นเหมือนก่อนนับ' : 'ลบออกจากประวัติและกราฟ ยอดบัญชีปัจจุบันไม่เปลี่ยน',
      'data-action="del-count-confirm" data-id="' + id + '"');
    return;
  }
  if (act === 'del-count-confirm') {
    const restored = removeCount(id);
    closeSheet(); render();
    toast(restored ? 'ลบแล้ว · คืนยอดบัญชีให้เรียบร้อย' : 'ลบออกจากประวัติแล้ว');
    return;
  }

  if (act === 'move-account') {
    const dir = parseInt(el.dataset.dir, 10);
    const acc = account(id);
    if (!acc) return;
    const siblings = visibleAccounts(acc.ownerId);
    const pos = siblings.indexOf(acc);
    const target = siblings[pos + dir];
    if (!target) return;
    const i = state.accounts.indexOf(acc), j = state.accounts.indexOf(target);
    state.accounts[i] = target; state.accounts[j] = acc;
    save(); renderAccounts();
    return;
  }

  if (act === 'toggle-field') {
    const cb = el.parentElement.querySelector('input[name="' + el.dataset.field + '"]');
    if (cb) { cb.checked = !cb.checked; el.classList.toggle('on', cb.checked); }
    return;
  }

  if (act === 'del-owner') {
    const left = visibleAccounts(id).length;
    if (left) { toast('ย้ายหรือลบบัญชีทั้ง ' + left + ' บัญชีออกก่อน'); return; }
    if (state.owners.length <= 1) { toast('ต้องเหลือเจ้าของอย่างน้อย 1 คน'); return; }
    state.owners = state.owners.filter(function (o) { return o.id !== id; });
    save(); closeSheet(); render(); toast('ลบเจ้าของแล้ว');
    return;
  }

  if (act === 'del-account') {
    confirmSheet('ลบบัญชีนี้?', 'ยอดคงเหลือจะหายจากสินทรัพย์รวม', 'data-action="del-account-confirm" data-id="' + id + '"');
    return;
  }
  if (act === 'del-account-confirm') {
    state.accounts = state.accounts.filter(function (a) { return a.id !== id; });
    save(); closeSheet(); render(); toast('ลบบัญชีแล้ว');
    return;
  }

  if (act === 'reset') {
    confirmSheet('รีเซ็ตข้อมูลทั้งหมด?', 'ทุกอย่างจะกลับไปเป็นค่าเริ่มต้นจาก Google Sheet', 'data-action="reset-confirm"');
    return;
  }
  if (act === 'reset-confirm') {
    state = seed();
    save(); closeSheet(); render(); toast('รีเซ็ตกลับค่าเริ่มต้นแล้ว');
    return;
  }
});

// ช่องกรอกในหน้านับเงิน — อัปเดตยอดสรุปสดโดยไม่ re-render ทั้งชีต (จะได้ไม่หลุดโฟกัส)
document.addEventListener('input', function (ev) {
  const t = ev.target;
  if (!countDraft) return;
  if (t.dataset.acc) {
    countDraft.balances[t.dataset.acc] = t.value === '' ? '' : Number(t.value);
    const row = t.closest('.cnt-row');
    const acc = account(t.dataset.acc);
    if (row && acc) {
      const d = (t.value === '' ? 0 : Number(t.value) || 0) - (Number(acc.balance) || 0);
      const dEl = row.querySelector('.delta');
      if (dEl) {
        dEl.className = 'delta ' + (d < 0 ? 'down' : d > 0 ? 'up' : '');
        dEl.textContent = d === 0 ? 'เท่าเดิม' : (d > 0 ? '+' : '') + money(d);
      }
    }
    updateCountTally();
  } else if (t.dataset.countNote) {
    countDraft.note = t.value;
  }
});

document.addEventListener('submit', function (ev) {
  const form = ev.target.closest('form[data-form]');
  if (!form) return;
  ev.preventDefault();
  const kind = form.dataset.form;
  const id = form.dataset.id;
  const fd = new FormData(form);
  const num = function (k) { return Math.round((parseFloat(fd.get(k)) || 0) * 100) / 100; };

  if (kind === 'item-record') {
    const it = item(id);
    if (!it) return;
    const amount = num('amount');
    if (amount < 0) { toast('ยอดต้องไม่ติดลบ'); return; }
    if (it.type === 'fixed') {
      recordItem(id, state.activeMonth, {
        paid: true, amount: amount, principal: num('principal'), interest: num('interest')
      });
      toast(it.name + ' · จ่ายแล้ว ' + money(amount));
    } else {
      recordItem(id, state.activeMonth, { amount: amount });
      toast(it.name + ' · ใช้ไป ' + money(amount));
    }
    closeSheet(); render();
    return;
  }

  if (kind === 'item-edit' || kind === 'item-add') {
    const data = {
      emoji: (fd.get('emoji') || '💸').toString().trim() || '💸',
      name: (fd.get('name') || '').toString().trim(),
      budget: num('budget'),
      type: fd.get('type') === 'fixed' ? 'fixed' : 'variable',
      ownerId: fd.get('ownerId'),
      linkedAccountId: (fd.get('linkedAccountId') || '').toString()
    };
    if (!data.name) { toast('ใส่ชื่อรายการ'); return; }
    if (kind === 'item-add') {
      state.items.push(Object.assign({ id: uid('i') }, data));
      toast('เพิ่ม "' + data.name + '" แล้ว');
    } else {
      Object.assign(item(id), data);
      toast('บันทึกแล้ว');
    }
    save(); closeSheet(); render();
    return;
  }

  if (kind === 'account') {
    const kindId = (fd.get('kind') || 'other').toString();
    const color = (fd.get('color') || '').toString().trim();
    const data = {
      name: (fd.get('name') || '').toString().trim(),
      balance: num('balance'),
      kind: kindId,
      bankId: (fd.get('bankId') || '').toString(),
      emoji: (fd.get('emoji') || '').toString().trim() || kindOf(kindId).emoji,
      color: /^#[0-9a-fA-F]{3,8}$/.test(color) ? color : '',
      ownerId: fd.get('ownerId'),
      note: (fd.get('note') || '').toString().trim(),
      countable: fd.get('countable') === 'on',
      liquid: fd.get('liquid') === 'on',
      hidden: fd.get('hidden') === 'on'
    };
    if (!data.name) { toast('ใส่ชื่อบัญชี'); return; }
    if (color && !data.color) { toast('รหัสสีต้องขึ้นต้นด้วย # เช่น #10B981'); return; }
    if (id) { Object.assign(account(id), data); toast('บันทึกบัญชีแล้ว'); }
    else { state.accounts.push(Object.assign({ id: uid('a') }, data)); toast('เพิ่มบัญชีแล้ว'); }
    save(); closeSheet(); render();
    return;
  }

  if (kind === 'owner') {
    const color = (fd.get('color') || '').toString().trim();
    const data = {
      name: (fd.get('name') || '').toString().trim(),
      color: /^#[0-9a-fA-F]{3,8}$/.test(color) ? color : '#10b981'
    };
    if (!data.name) { toast('ใส่ชื่อเจ้าของ'); return; }
    if (id) { Object.assign(owner(id), data); toast('บันทึกแล้ว'); }
    else { state.owners.push(Object.assign({ id: uid('o') }, data)); toast('เพิ่มเจ้าของแล้ว'); }
    save(); closeSheet(); render();
    return;
  }

  if (kind === 'owner') {
    const color = (fd.get('color') || '').toString().trim();
    const data = {
      name: (fd.get('name') || '').toString().trim(),
      color: /^#[0-9a-fA-F]{3,8}$/.test(color) ? color : '#10b981'
    };
    if (!data.name) { toast('ใส่ชื่อเจ้าของ'); return; }
    if (id) { Object.assign(owner(id), data); toast('บันทึกแล้ว'); }
    else { state.owners.push(Object.assign({ id: uid('o') }, data)); toast('เพิ่มเจ้าของแล้ว'); }
    save(); closeSheet(); render();
    return;
  }

});

document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape' && sheetEl.classList.contains('open')) closeSheet();
});

/* แตะจุด/แท่งในกราฟเพื่อดูค่า — เป็นช่องทางเสริมเท่านั้น
   ทุกค่าอ่านได้จากป้ายกำกับหรือมุมมองตารางอยู่แล้ว */
let tipTimer = null;
const tipEl = document.getElementById('tip');
document.addEventListener('pointerdown', function (ev) {
  const hit = ev.target.closest ? ev.target.closest('[data-tip]') : null;
  if (!hit) { tipEl.classList.remove('show'); return; }
  const r = hit.getBoundingClientRect();
  tipEl.textContent = hit.getAttribute('data-tip');
  tipEl.style.left = Math.round(r.left + r.width / 2) + 'px';
  tipEl.style.top = Math.round(r.top + r.height / 2) + 'px';
  tipEl.classList.add('show');
  clearTimeout(tipTimer);
  tipTimer = setTimeout(function () { tipEl.classList.remove('show'); }, 2600);
});

/* ========================= boot ========================= */
try {
  const savedTheme = localStorage.getItem(THEME_KEY);
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
} catch (e) {}

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
  // service worker ตัวใหม่เข้าคุมเมื่อไหร่ ให้โหลดหน้าใหม่รอบเดียวเพื่อรับเวอร์ชันล่าสุด
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (reloading) return;
    reloading = true;
    window.location.reload();
  });
}
})();
</script>
</body>
</html>
