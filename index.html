/* ========================= events ========================= */
document.addEventListener('click', function (ev) {
  // แตะช่องกรอก/ดรอปดาวน์ที่อยู่ในแถวซึ่งกดได้ ต้องไม่ไปสั่ง action ของแถวนั้น
  const tag = ev.target.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || tag === 'LABEL') return;
  const el = ev.target.closest('[data-action]');
  if (!el) return;
  const act = el.dataset.action;
  const id = el.dataset.id;

  if (act === 'tab') { setTab(el.dataset.tab); return; }

  if (act === 'month') {
    state.activeMonth = shiftMonth(state.activeMonth, parseInt(el.dataset.step, 10));
    save(); render(); return;
  }

  if (act === 'toggle-theme') {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : cur === 'light' ? 'dark' :
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    toast(next === 'dark' ? 'โหมดมืด' : 'โหมดสว่าง');
    return;
  }

  if (act === 'close-sheet') { closeSheet(); return; }
  if (act === 'open-env') { envSheet(id, 'spend'); return; }
  if (act === 'env-mode') { envSheet(id, el.dataset.mode); return; }
  if (act === 'add-env') { addEnvSheet(); return; }
  if (act === 'add-account') { accountSheet(null); return; }
  if (act === 'edit-account') { accountSheet(id); return; }
  if (act === 'add-owner') { ownerSheet(null); return; }
  if (act === 'edit-owner') { ownerSheet(id); return; }
  if (act === 'add-debt') { debtSheet(null); return; }
  if (act === 'edit-debt') { debtSheet(id); return; }

  if (act === 'stats-range') { statsRange = parseInt(el.dataset.n, 10); renderStats(); return; }
  if (act === 'stats-view') { statsTable = !statsTable; renderStats(); return; }

  if (act === 'start-count') { startCount(); return; }
  if (act === 'open-count') { countDetailSheet(id); return; }

  if (act === 'count-step') {
    countDraft.step = parseInt(el.dataset.step, 10);
    countSheet();
    return;
  }

  if (act === 'count-pick') {
    const input = el.querySelector('input[data-paid]');
    if (countDraft.paid[id] !== undefined) {
      delete countDraft.paid[id];
      el.classList.remove('on');
      if (input) input.disabled = true;
    } else {
      const budget = budgetOf(id, state.activeMonth), already = spentOf(id, state.activeMonth);
      const suggested = Math.max(0, Math.round((budget - already) * 100) / 100);
      countDraft.paid[id] = input ? (Number(input.value) || suggested) : suggested;
      el.classList.add('on');
      if (input) input.disabled = false;
    }
    countDraft.miscOverride = null;  // ให้คำนวณส่วนต่างใหม่ตามที่ติ๊ก
    updateCountTally();
    return;
  }

  if (act === 'count-save') {
    const res = saveCount(countDraft);
    countDraft = null;
    closeSheet(); render();
    toast(res.income > 0
      ? 'บันทึกแล้ว · เงินเข้า ' + money(res.income)
      : 'บันทึกแล้ว · ใช้ไป ' + money(res.drop) + (res.misc > 0 ? ' (จิปาถะ ' + money(res.misc) + ')' : ''));
    return;
  }

  if (act === 'undo-count') {
    confirmSheet('ยกเลิกการนับรอบนี้?', 'ยอดบัญชีและรายการที่บันทึกจากรอบนี้จะกลับไปเป็นเหมือนก่อนนับ',
      'data-action="undo-count-confirm" data-id="' + id + '"');
    return;
  }
  if (act === 'undo-count-confirm') {
    undoCount(id);
    closeSheet(); render();
    toast('ยกเลิกการนับแล้ว');
    return;
  }

  if (act === 'move-account') {
    const dir = parseInt(el.dataset.dir, 10);
    const acc = account(id);
    if (!acc) return;
    const siblings = visibleAccounts(acc.ownerId);
    const pos = siblings.indexOf(acc);
    const target = siblings[pos + dir];
    if (!target) return;
    const i = state.accounts.indexOf(acc), j = state.accounts.indexOf(target);
    state.accounts[i] = target; state.accounts[j] = acc;
    save(); renderAccounts();
    return;
  }

  if (act === 'toggle-field') {
    const cb = el.parentElement.querySelector('input[name="' + el.dataset.field + '"]');
    if (cb) { cb.checked = !cb.checked; el.classList.toggle('on', cb.checked); }
    return;
  }

  if (act === 'del-owner') {
    const left = visibleAccounts(id).length;
    if (left) { toast('ย้ายหรือลบบัญชีทั้ง ' + left + ' บัญชีออกก่อน'); return; }
    if (state.owners.length <= 1) { toast('ต้องเหลือเจ้าของอย่างน้อย 1 คน'); return; }
    state.owners = state.owners.filter(function (o) { return o.id !== id; });
    save(); closeSheet(); render(); toast('ลบเจ้าของแล้ว');
    return;
  }

  if (act === 'toggle-bill') {
    const month = el.dataset.month;
    const bills = billsOf(id);
    if (bills[month]) delete bills[month]; else bills[month] = true;
    save(); renderBills(); return;
  }

  if (act === 'del-txn') {
    removeTxn(id);
    envSheet(el.dataset.env, 'spend');
    render();
    toast('ลบรายการแล้ว');
    return;
  }

  if (act === 'del-move') {
    const i = state.transfers.findIndex(function (t) { return t.id === id; });
    if (i >= 0) { state.transfers.splice(i, 1); save(); }
    envSheet(el.dataset.env, 'move');
    render();
    toast('ยกเลิกการโยกแล้ว');
    return;
  }

  if (act === 'del-env') {
    confirmSheet('ลบซองนี้?', 'ประวัติการจ่ายและการโยกเงินของซองนี้จะถูกลบด้วย', 'data-action="del-env-confirm" data-id="' + id + '"');
    return;
  }
  if (act === 'del-env-confirm') {
    state.envelopes = state.envelopes.filter(function (e) { return e.id !== id; });
    state.txns = state.txns.filter(function (t) { return t.envelopeId !== id; });
    state.transfers = state.transfers.filter(function (t) { return t.fromEnvelopeId !== id && t.toEnvelopeId !== id; });
    delete state.bills[id];
    // ซองปลายทางของส่วนต่างต้องมีอยู่เสมอ
    if (state.miscEnvelopeId === id) state.miscEnvelopeId = (state.envelopes[0] || {}).id || '';
    save(); closeSheet(); render(); toast('ลบซองแล้ว');
    return;
  }

  if (act === 'del-account') {
    confirmSheet('ลบบัญชีนี้?', 'ยอดคงเหลือจะหายจากสินทรัพย์รวม', 'data-action="del-account-confirm" data-id="' + id + '"');
    return;
  }
  if (act === 'del-account-confirm') {
    state.accounts = state.accounts.filter(function (a) { return a.id !== id; });
    save(); closeSheet(); render(); toast('ลบบัญชีแล้ว');
    return;
  }

  if (act === 'del-debt') {
    confirmSheet('ลบรายการหนี้นี้?', 'ยอดหนี้จะหายจากสินทรัพย์สุทธิ', 'data-action="del-debt-confirm" data-id="' + id + '"');
    return;
  }
  if (act === 'del-debt-confirm') {
    state.debts = state.debts.filter(function (d) { return d.id !== id; });
    save(); closeSheet(); render(); toast('ลบรายการหนี้แล้ว');
    return;
  }

  if (act === 'reset') {
    confirmSheet('รีเซ็ตข้อมูลทั้งหมด?', 'ทุกอย่างจะกลับไปเป็นค่าเริ่มต้นจาก Google Sheet', 'data-action="reset-confirm"');
    return;
  }
  if (act === 'reset-confirm') {
    state = seed();
    save(); closeSheet(); render(); toast('รีเซ็ตกลับค่าเริ่มต้นแล้ว');
    return;
  }
});

// ช่องกรอกใน wizard นับเงิน — อัปเดตยอดสรุปสดโดยไม่ re-render ทั้งชีต (จะได้ไม่หลุดโฟกัส)
document.addEventListener('input', function (ev) {
  const t = ev.target;
  if (!countDraft) return;
  if (t.dataset.acc) {
    countDraft.balances[t.dataset.acc] = t.value === '' ? '' : Number(t.value);
    countDraft.miscOverride = null;
    const row = t.closest('.cnt-row');
    const acc = account(t.dataset.acc);
    if (row && acc) {
      const d = (t.value === '' ? 0 : Number(t.value) || 0) - (Number(acc.balance) || 0);
      const dEl = row.querySelector('.delta');
      if (dEl) {
        dEl.className = 'delta ' + (d < 0 ? 'down' : d > 0 ? 'up' : '');
        dEl.textContent = d === 0 ? 'เท่าเดิม' : (d > 0 ? '+' : '') + money(d);
      }
    }
    updateCountTally();
  } else if (t.dataset.paid) {
    countDraft.paid[t.dataset.paid] = t.value === '' ? 0 : Number(t.value);
    countDraft.miscOverride = null;
    updateCountTally();
  } else if (t.dataset.misc) {
    countDraft.miscOverride = t.value === '' ? 0 : Number(t.value);
  } else if (t.dataset.countNote) {
    countDraft.note = t.value;
  }
});

document.addEventListener('change', function (ev) {
  const t = ev.target;
  if (t.dataset.miscEnv && countDraft) { countDraft.miscEnvelopeId = t.value; return; }
  if (t.dataset.setting === 'misc-envelope') {
    state.miscEnvelopeId = t.value;
    save(); renderAccounts();
    toast('ตั้งซองปลายทางแล้ว');
  }
});

document.addEventListener('submit', function (ev) {
  const form = ev.target.closest('form[data-form]');
  if (!form) return;
  ev.preventDefault();
  const kind = form.dataset.form;
  const id = form.dataset.id;
  const fd = new FormData(form);
  const num = function (k) { return Math.round((parseFloat(fd.get(k)) || 0) * 100) / 100; };

  if (kind === 'spend') {
    const amount = num('amount');
    if (amount <= 0) { toast('ใส่จำนวนเงินมากกว่า 0'); return; }
    const accId = fd.get('accountId');
    if (!accId) { toast('เลือกบัญชีที่จ่าย'); return; }
    const ticked = recordSpend(id, accId, amount, (fd.get('note') || '').toString().trim());
    closeSheet(); render();
    toast(ticked ? 'บันทึก ' + money(amount) + ' · ติ๊กบิลเดือนนี้ให้แล้ว' : 'บันทึก ' + money(amount) + ' แล้ว');
    return;
  }

  if (kind === 'move') {
    const amount = num('amount');
    const toId = fd.get('toId');
    const available = leftOf(id, state.activeMonth);
    if (amount <= 0) { toast('ใส่จำนวนเงินมากกว่า 0'); return; }
    if (!toId) { toast('เลือกซองปลายทาง'); return; }
    if (amount > available) { toast('โยกได้สูงสุด ' + money(Math.max(0, available))); return; }
    moveMoney(id, toId, amount);
    const to = envelope(toId);
    closeSheet(); render();
    toast('โยก ' + money(amount) + ' ไป ' + (to ? to.name : ''));
    return;
  }

  if (kind === 'env-edit' || kind === 'env-add') {
    const data = {
      emoji: (fd.get('emoji') || '✉️').toString().trim() || '✉️',
      name: (fd.get('name') || '').toString().trim(),
      budget: num('budget'),
      categoryId: fd.get('categoryId'),
      ownerId: fd.get('ownerId'),
      recurring: fd.get('recurring') === 'on'
    };
    if (!data.name) { toast('ใส่ชื่อซอง'); return; }
    if (kind === 'env-add') {
      state.envelopes.push(Object.assign({ id: uid('e'), dueDay: 0 }, data));
      toast('เพิ่มซอง “' + data.name + '” แล้ว');
    } else {
      Object.assign(envelope(id), data);
      toast('บันทึกการแก้ไขแล้ว');
    }
    save(); closeSheet(); render();
    return;
  }

  if (kind === 'account') {
    const kindId = (fd.get('kind') || 'other').toString();
    const color = (fd.get('color') || '').toString().trim();
    const data = {
      name: (fd.get('name') || '').toString().trim(),
      balance: num('balance'),
      kind: kindId,
      bankId: (fd.get('bankId') || '').toString(),
      emoji: (fd.get('emoji') || '').toString().trim() || kindOf(kindId).emoji,
      color: /^#[0-9a-fA-F]{3,8}$/.test(color) ? color : '',
      ownerId: fd.get('ownerId'),
      note: (fd.get('note') || '').toString().trim(),
      countable: fd.get('countable') === 'on',
      hidden: fd.get('hidden') === 'on'
    };
    if (!data.name) { toast('ใส่ชื่อบัญชี'); return; }
    if (color && !data.color) { toast('รหัสสีต้องขึ้นต้นด้วย # เช่น #10B981'); return; }
    if (id) { Object.assign(account(id), data); toast('บันทึกบัญชีแล้ว'); }
    else { state.accounts.push(Object.assign({ id: uid('a') }, data)); toast('เพิ่มบัญชีแล้ว'); }
    save(); closeSheet(); render();
    return;
  }

  if (kind === 'owner') {
    const color = (fd.get('color') || '').toString().trim();
    const data = {
      name: (fd.get('name') || '').toString().trim(),
      color: /^#[0-9a-fA-F]{3,8}$/.test(color) ? color : '#10b981'
    };
    if (!data.name) { toast('ใส่ชื่อเจ้าของ'); return; }
    if (id) { Object.assign(owner(id), data); toast('บันทึกแล้ว'); }
    else { state.owners.push(Object.assign({ id: uid('o') }, data)); toast('เพิ่มเจ้าของแล้ว'); }
    save(); closeSheet(); render();
    return;
  }

  if (kind === 'debt') {
    const data = {
      name: (fd.get('name') || '').toString().trim(),
      remaining: num('remaining'),
      monthly: num('monthly'),
      ownerId: fd.get('ownerId')
    };
    if (!data.name) { toast('ใส่ชื่อรายการหนี้'); return; }
    if (id) { Object.assign(byId(state.debts, id), data); toast('บันทึกแล้ว'); }
    else { state.debts.push(Object.assign({ id: uid('d') }, data)); toast('เพิ่มรายการหนี้แล้ว'); }
    save(); closeSheet(); render();
    return;
  }
});

document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape' && sheetEl.classList.contains('open')) closeSheet();
});

/* แตะจุด/แท่งในกราฟเพื่อดูค่า — เป็นช่องทางเสริมเท่านั้น
   ทุกค่าอ่านได้จากป้ายกำกับหรือมุมมองตารางอยู่แล้ว */
let tipTimer = null;
const tipEl = document.getElementById('tip');
document.addEventListener('pointerdown', function (ev) {
  const hit = ev.target.closest ? ev.target.closest('[data-tip]') : null;
  if (!hit) { tipEl.classList.remove('show'); return; }
  const r = hit.getBoundingClientRect();
  tipEl.textContent = hit.getAttribute('data-tip');
  tipEl.style.left = Math.round(r.left + r.width / 2) + 'px';
  tipEl.style.top = Math.round(r.top + r.height / 2) + 'px';
  tipEl.classList.add('show');
  clearTimeout(tipTimer);
  tipTimer = setTimeout(function () { tipEl.classList.remove('show'); }, 2600);
});

/* ========================= boot ========================= */
try {
  const savedTheme = localStorage.getItem(THEME_KEY);
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
} catch (e) {}

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
})();
</script>
