name: Build Android APK

# APK เป็นตัวหุ้มบาง ๆ ที่โหลดหน้าเว็บจาก GitHub Pages
# เนื้อหาแอปอัปเดตเองผ่าน Pages จึงไม่ต้อง build APK ใหม่ทุกครั้งที่แก้โค้ดเว็บ
# workflow นี้จะรันเมื่อแก้ตัวหุ้ม (โฟลเดอร์ android/) หรือกดสั่งรันเอง
on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'congrateprim' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'gobsong' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'congrateprim' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "ใช้ keystore จาก repository secret (ลายเซ็นคงที่ อัปเดตทับแอปเดิมได้)"
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          else
            echo "ไม่พบ secret ANDROID_KEYSTORE_BASE64 — สร้าง keystore ชั่วคราวสำหรับ build นี้"
            echo "หมายเหตุ: ลายเซ็นจะเปลี่ยนทุกครั้ง ต้องถอนแอปเดิมก่อนลงตัวใหม่"
            keytool -genkeypair -v \
              -keystore android/app/keystore.jks \
              -alias "${ANDROID_KEY_ALIAS:-gobsong}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${ANDROID_KEYSTORE_PASSWORD:-congrateprim}" \
              -keypass "${ANDROID_KEY_PASSWORD:-congrateprim}" \
              -dname "CN=Gob Song, OU=Personal, O=CongratePrim, L=Bangkok, C=TH"
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'congrateprim' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'gobsong' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'congrateprim' }}
        run: |
          APP_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "APK จะโหลดหน้าเว็บจาก: $APP_URL"
          gradle -p android assembleRelease --no-daemon \
            -PappUrl="$APP_URL" \
            -PversionCode=${{ github.run_number }} \
            -PversionName="1.${{ github.run_number }}"

      - name: Rename APK
        id: apk
        run: |
          SRC=android/app/build/outputs/apk/release/app-release.apk
          DEST="gobsong-1.${{ github.run_number }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gobsong-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.${{ github.run_number }}
          name: งบซอง APK v1.${{ github.run_number }}
          body: |
            APK ตัวหุ้มของแอป **งบซอง** — เปิดหน้าเว็บจาก GitHub Pages

            - โหลดไฟล์ `.apk` ด้านล่างจากมือถือ Android แล้วกดติดตั้ง
            - ต้องอนุญาต "ติดตั้งแอปจากแหล่งที่ไม่รู้จัก" ให้เบราว์เซอร์ที่ใช้โหลด
            - เนื้อหาแอปอัปเดตเองจาก Pages ไม่ต้องโหลด APK ใหม่เมื่อแก้โค้ดเว็บ
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
