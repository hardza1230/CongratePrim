name: Build APK

# Builds a debug APK you can download and install on your phone.
# Runs automatically on every push, and can be started by hand from the
# Actions tab (Run workflow).
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

# Needed so the workflow can publish the APK as a Release asset.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub's ubuntu runner already ships with the Android SDK, so we only
      # need a matching JDK and Gradle.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Restore the persistent signing key from a secret so every build is
      # signed identically → phones accept new APKs as in-place updates.
      # If the KEYSTORE_B64 secret is not set, we fall back to default signing.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/autotapper.keystore
            echo "Signing key restored — builds will update in place."
          else
            echo "No KEYSTORE_B64 secret set — using default debug signing (update needs reinstall)."
          fi

      - name: Build debug APK
        # Feed the run number in as the version so every build supersedes the last.
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: autotapper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publish the raw .apk as a Release asset so it can be downloaded with a
      # single tap on a phone — no login, no zip to extract. The "latest-apk"
      # release is updated in place on every build.
      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest AutoTapper APK
          body: |
            Auto-built debug APK. Tap **app-debug.apk** below to download and install it directly on your phone.
          files: app/build/outputs/apk/debug/app-debug.apk
