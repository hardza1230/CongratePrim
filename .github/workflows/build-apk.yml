name: Build APK

# Builds a debug APK you can download and install on your phone.
# Runs automatically on every push, and can be started by hand from the
# Actions tab (Run workflow).
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub's ubuntu runner already ships with the Android SDK, so we only
      # need a matching JDK and Gradle.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: autotapper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
